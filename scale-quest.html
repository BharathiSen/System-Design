{q:"Batching 100 small writes into one request mainly improves…",o:["Throughput (fewer round trips)","Latency of the first write","Security","Consistency"],a:0,why:"Fewer round trips → more work per second, though individual items may wait slightly."},
{q:"Why avoid a cross-continent database call on every request?",o:["It's not allowed","Each round trip costs ~100+ ms, dominating the latency budget","Databases can't do it","It uses more disk"],a:1,why:"Network distance is the slowest common cost."}],
"cap":[
{q:"Seat booking for a concert: during a partition, which do you prefer?",o:["AP: sell anyway, fix later","CP: refuse or wait rather than double-sell","Neither","Whatever is faster"],a:1,why:"Double-selling a seat is worse than a short error."},
{q:"A social feed during a partition shows a post a few seconds late. This is…",o:["A CP choice","An AP choice: available with stale data","A bug in TCP","Strong consistency"],a:1,why:"AP systems keep answering and converge later."},
{q:"PACELC says that even with no partition, you trade…",o:["Cost vs security","Latency vs consistency","CPU vs memory","Reads vs writes"],a:1,why:"Waiting for replicas to agree adds latency."},
{q:"Read-your-writes consistency guarantees that…",o:["Everyone sees every write instantly","You always see your own latest writes","Writes never fail","Reads are cached"],a:1,why:"It's a per-user guarantee, weaker than strong consistency."}],

"proxies-lb":[

"api-styles":[

const CARDS=[
["Basics","What's the difference between HLD and LLD?","HLD = components and how they interact (services, DBs, caches, queues). LLD = classes, interfaces, methods and code for one component."],
["Basics","Vertical vs horizontal scaling?","Vertical: bigger machine (simple, has a ceiling, SPOF). Horizontal: more machines behind an LB (needs stateless apps, scales further)."],
["Basics","Why must app servers be stateless to scale out?","So any instance can serve any request; state lives in Redis/DB, letting you add or remove servers freely."],
["Basics","99.9% availability = how much downtime per year?","About 8.76 hours (≈ 43.8 minutes per month)."],
["Basics","Availability of two 99.9% services in series?","≈ 99.8% (multiply: 0.999 × 0.999)."],
["Basics","Latency vs throughput?","Latency = time for one request. Throughput = requests completed per unit time."],
["Basics","Why report p99 instead of average latency?","Averages hide slow tail requests; users and fan-out calls feel the tail."],
["Basics","CAP theorem in one sentence?","During a network partition, a distributed store must choose consistency (reject/wait) or availability (answer possibly stale)."],
["Basics","What does PACELC add to CAP?","Even without a partition (Else), you trade Latency vs Consistency."],
["Basics","Quorum condition for reading the latest write?","W + R > N (write and read sets overlap)."],
["Network","What happens when you type a URL?","DNS lookup → TCP handshake → TLS handshake → HTTP request → LB → app → DB/cache → response → browser renders and fetches assets (often from CDN)."],
["Network","TCP vs UDP?","TCP: connection, ordered, reliable. UDP: connectionless, no guarantees, lower overhead (video, games, DNS, QUIC)."],
["Network","What does HTTP/3 fix over HTTP/2?","Runs on QUIC over UDP so a lost packet doesn't block other streams (no TCP head-of-line blocking); faster handshakes."],
["Network","401 vs 403?","401: not authenticated (who are you?). 403: authenticated but not allowed."],
["Network","DNS resolution order?","Resolver → root → TLD → authoritative name server; answers cached per TTL."],
["Network","Pull vs push CDN?","Pull: edge fetches from origin on a miss. Push: you upload content to the CDN ahead of time."],
["Network","L4 vs L7 load balancer?","L4 routes on IP/port (fast, protocol-agnostic). L7 reads HTTP (paths, headers, cookies) for smart routing."],
["Network","Forward vs reverse proxy?","Forward acts for clients (VPN/corporate proxy). Reverse acts for servers (nginx: TLS, caching, LB)."],
["Network","What does an API gateway do?","Single entry: auth, rate limiting, routing to services, TLS, metrics, request transformation."],
["Network","REST vs gRPC vs GraphQL, when?","REST: public CRUD APIs. gRPC: fast typed internal service calls. GraphQL: many clients needing flexible data shapes."],
["Network","Cursor vs offset pagination?","Cursor ('after id X') is stable under inserts and fast with an index; offset is simple but slow for deep pages and skips/duplicates on change."],
["Network","What is an idempotency key?","A client-generated unique key sent with a POST; the server stores the result and returns it for retries, preventing duplicates."],
["Network","SSE vs WebSockets?","SSE: one-way server→client over HTTP (notifications, LLM streaming). WebSockets: full duplex (chat, games)."],
["Network","Sessions vs JWT?","Sessions: server-side state, easy revoke. JWT: stateless signed token, verify anywhere, hard to revoke → short expiry + refresh tokens."],
["Network","OAuth2 vs OIDC?","OAuth2 delegates authorization (access tokens). OIDC adds authentication (ID token) on top: 'Sign in with Google'."],
["Data","When pick SQL over NoSQL?","Relations, joins, multi-row transactions, ad-hoc queries, strong consistency."],
["Data","When pick a wide-column store like Cassandra?","Massive write-heavy data read by a known partition key and range (messages, events, time-series)."],
["Data","ACID?","Atomicity (all or nothing), Consistency (constraints hold), Isolation (no interference), Durability (survives crashes)."],
["Data","Postgres default isolation level?","Read committed."],
["Data","Optimistic vs pessimistic locking?","Optimistic: version check on write, retry on conflict (rare conflicts). Pessimistic: SELECT … FOR UPDATE lock (high contention)."],
["Data","Leftmost-prefix rule?","A composite index (a, b) helps queries on a, or a+b, but not b alone."],
["Data","B-tree vs LSM tree?","B-tree: in-place pages, fast reads (Postgres/MySQL). LSM: append + compaction, very fast writes (Cassandra/RocksDB)."],
["Data","What does replication give you?","Availability and read scaling (not write scaling)."],
["Data","What is replication lag and a fix for read-your-writes?","Async followers trail the leader; route a user's reads to the leader for a short time after they write."],
["Data","Sharding vs replication?","Sharding splits data across nodes (scales writes/storage). Replication copies data (availability/reads)."],
["Data","What makes a good shard key?","High cardinality, even load, matches the main query, not monotonically increasing for range sharding."],
["Data","Why consistent hashing?","Adding/removing a node moves only ~K/N keys instead of almost all (mod N)."],
["Data","Why virtual nodes?","Even out load on the ring and allow weighting bigger machines."],
["Data","Cache-aside flow?","Read: check cache → miss → read DB → fill cache. Write: update DB → delete cache key."],
["Data","Write-through vs write-back?","Through: write cache + DB together (fresh, slower writes). Back: write cache, flush later (fast, risk of loss)."],
["Data","Cache stampede fix?","Single-flight lock / lease so one request refills, serve stale while revalidating, TTL jitter."],
["Data","Cache penetration fix?","Cache negative results briefly or use a Bloom filter of valid keys."],
["Data","Why presigned URLs?","Clients upload/download directly to object storage with time-limited permission, bypassing app servers."],
["Data","Inverted index?","Map of term → documents containing it; core of full-text search."],
["Data","Geohash in one line?","Encodes lat/long to a string where a shared prefix means nearby; query a cell + 8 neighbours."],
["Async","Why use a message queue?","Decouple services, absorb spikes, do slow work async, retry safely, fan out events."],
["Async","At-least-once vs exactly-once?","At-least-once may duplicate (common). Exactly-once in practice = at-least-once + idempotent consumers."],
["Async","How does Kafka keep order?","Per partition. Same message key → same partition → ordered."],
["Async","Kafka consumer group rule?","Each partition is consumed by exactly one consumer in the group; parallelism ≤ partitions."],
["Async","Dead-letter queue?","Where messages go after N failed attempts, so poison messages don't block the queue."],
["Async","Token bucket in one line?","Bucket of up to B tokens refilled at r/s; each request spends one; allows bursts up to B."],
["Async","Fixed window rate limit flaw?","Up to 2× the limit can pass around the window boundary."],
["Async","Exponential backoff with jitter?","Retry delays grow (100, 200, 400 ms…) plus randomness so clients don't retry in sync."],
["Async","Circuit breaker states?","Closed (normal) → Open (fail fast) → Half-open (trial calls) → Closed if healthy."],
["Async","Saga pattern?","Sequence of local transactions with compensating actions to undo earlier steps on failure."],
["Async","Outbox pattern?","Write the business row and an outbox event in one DB transaction; a relay publishes outbox rows to the broker."],
["Async","Four golden signals?","Latency, traffic, errors, saturation."],
["Async","Logs vs metrics vs traces?","Metrics: something's wrong. Traces: where. Logs: why."],
["Async","Monolith or microservices for a new product?","Modular monolith first; split services when teams or scaling needs differ."],
["Dist","Raft cluster of 5 tolerates how many failures?","2 (majority of 3 needed)."],
["Dist","Why fencing tokens with locks?","A stale lock holder (paused) can't overwrite newer work: storage rejects older tokens."],
["Dist","Snowflake ID layout?","1 sign bit + 41-bit timestamp + 10-bit machine ID + 12-bit sequence."],
["Dist","Bloom filter guarantees?","No false negatives; false positives possible."],
["Dist","HyperLogLog is for…?","Approximate distinct counts in tiny memory (~0.81% error in 12 KB in Redis)."],
["Dist","Lamport vs vector clocks?","Lamport: total order consistent with causality. Vector: can also detect concurrent updates."],
["Dist","Batch vs stream?","Batch: bounded data, scheduled, high latency. Stream: continuous events, seconds latency, windows."],
["Craft","The 7 delivery steps?","Requirements → estimates → core entities → API → high-level design → deep dives → wrap-up."],
["Craft","1M requests/day ≈ how many per second?","About 12/s (÷ 86,400)."],
["Craft","Fan-out on write vs read?","Write: push post IDs to followers' timelines (fast reads). Read: merge at read time (needed for celebrities). Use hybrid."],
["Craft","How to state a trade-off?","'X vs Y; given requirement Z, I pick X; if Z changed, I'd revisit.'"],
["LLD","SOLID?","Single responsibility, Open/closed, Liskov substitution, Interface segregation, Dependency inversion."],
["LLD","Strategy pattern?","Swap interchangeable algorithms behind one interface at runtime (fee rules, routing)."],
["LLD","State pattern?","Object changes behaviour with its internal state; each state is a class with its transitions (vending machine, approvals)."],
["LLD","Observer pattern?","Subscribers are notified when a subject changes (notifications, event listeners)."],
["LLD","LRU cache in O(1)?","Hash map + doubly linked list (Python: OrderedDict with move_to_end and popitem(last=False))."],
["LLD","Composition vs inheritance?","Prefer has-a composition for reuse; use is-a inheritance only for true subtypes."],
["AI","1 token ≈ ?","About 4 English characters or 0.75 words."],
["AI","RAG pipeline?","Ingest → chunk → embed → index; query → retrieve (hybrid) → rerank → prompt with context → generate with citations."],
["AI","RAG vs fine-tuning?","RAG: fresh/private knowledge with citations. Fine-tuning: style, format, narrow task behaviour."],
["AI","Where to enforce document permissions in RAG?","At retrieval time, filtering by the user's ACL, before the LLM sees anything."],
["AI","Why hybrid search?","Vectors capture meaning; BM25 catches exact terms (IDs, names, codes)."],
["AI","Workflow vs agent?","Fixed workflow when steps are known (cheaper, testable). Agent only when steps vary a lot."],
["AI","What is an eval golden set?","A fixed set of real inputs with expected outputs/rubrics used to regression-test prompts and models."],
["AI","What is prompt injection?","Untrusted content (docs, emails, web pages) trying to give the model instructions; treat it as data."],
["AI","KV cache?","Stored attention keys/values per token of active sequences; grows with context × concurrency and limits GPU capacity."],
["AI","What does an LLM gateway do?","Central auth, routing, fallbacks, rate limits, budgets, logging and cost attribution for model calls."]

<div class="card"><h3>S · Single responsibility</h3><p class="small">One reason to change per class.</p><pre><code>class Invoice:            # computes
    def total(self): ...
class InvoicePrinter:     # presents
    def print(self, inv): ...
class InvoiceRepo:        # persists
    def save(self, inv): ...</code></pre></div>
<div class="card"><h3>O · Open/closed</h3><p class="small">Extend with new classes; don't edit working code.</p><pre><code>class Discount(ABC):
    @abstractmethod
    def apply(self, amt): ...
class Festive(Discount):
    def apply(self, amt): return amt * 0.9
# new discount = new class, Checkout unchanged</code></pre></div>
<div class="card"><h3>L · Liskov substitution</h3><p class="small">A subclass must work wherever its parent does.</p><pre><code>class Bird: ...
class FlyingBird(Bird):
    def fly(self): ...
class Sparrow(FlyingBird): ...
class Penguin(Bird): ...   # no fly() to break</code></pre></div>
<div class="card"><h3>I · Interface segregation</h3><p class="small">Small, focused interfaces.</p><pre><code>class Printer(Protocol):
    def print(self, doc): ...
class Scanner(Protocol):
    def scan(self) -> bytes: ...
class AllInOne:  # implements both; a basic printer only one</code></pre></div>
<div class="card"><h3>D · Dependency inversion</h3><p class="small">Depend on abstractions; inject them.</p><pre><code>class OrderRepo(ABC):
    @abstractmethod
    def save(self, o): ...
class OrderService:
    def __init__(self, repo: OrderRepo):
        self.repo = repo   # Postgres or in-memory in tests</code></pre></div>
<div class="card"><h3>Also say out loud</h3><ul class="small"><li><b>Encapsulation</b>: hide state, expose behaviour.</li><li><b>Composition over inheritance</b>.</li><li><b>DRY, KISS, YAGNI</b>.</li><li>Code smells: God class, long if/elif chains on type, feature envy, primitive obsession.</li></ul></div></div>`,
approach:`<div class="card notes"><h3>The 45-minute LLD playbook</h3><ol><li><b>Clarify (5 min)</b>: list must-haves and out-of-scope items.</li><li><b>Entities (5 min)</b>: nouns → classes; verbs → methods; enums for types and states.</li><li><b>Relationships</b>: composition (has-a) vs inheritance (is-a); draw a tiny class diagram on the whiteboard.</li><li><b>Interfaces</b>: where will behaviour vary? Put a Strategy/State/Observer there.</li><li><b>Code (20 min)</b>: core classes first, then a <code>main()</code> demo. Clean names, small methods, type hints.</li><li><b>Concurrency</b>: guard shared mutable state; make check-then-act atomic.</li><li><b>Extensions (5 min)</b>: show that a new requirement touches one or two classes.</li></ol>
<h3>Python toolkit</h3><ul><li><code>@dataclass</code> for entities, <code>Enum</code> for types/states, <code>abc.ABC</code>/<code>Protocol</code> for interfaces.</li><li><code>threading.Lock</code> / <code>RLock</code>; <code>queue.Queue</code> for producer-consumer.</li><li><code>collections.OrderedDict</code>, <code>heapq</code>, <code>defaultdict</code>.</li></ul></div>`,

patternCode:`<div class="sect"><h2>Core patterns in Python</h2></div><div class="grid g2">
<div class="card"><h3>Strategy</h3><pre><code>class FeeStrategy(ABC):
    @abstractmethod
    def fee(self, hours: float) -> int: ...

class Hourly(FeeStrategy):
    def __init__(self, rate): self.rate = rate
    def fee(self, hours): return math.ceil(hours) * self.rate

class Flat(FeeStrategy):
    def fee(self, hours): return 100</code></pre></div>
<div class="card"><h3>Observer</h3><pre><code>class EventBus:
    def __init__(self): self.subs = defaultdict(list)
    def subscribe(self, topic, fn): self.subs[topic].append(fn)
    def publish(self, topic, data):
        for fn in self.subs[topic]:
            fn(data)

bus = EventBus()
bus.subscribe("approved", lambda r: print("email", r))
bus.publish("approved", {"id": 7})</code></pre></div>
<div class="card"><h3>Factory</h3><pre><code>class VehicleFactory:
    _types = {"bike": Bike, "car": Car, "truck": Truck}
    @classmethod
    def create(cls, kind, plate):
        try:
            return cls._types[kind](plate)
        except KeyError:
            raise ValueError(f"unknown vehicle {kind}")</code></pre></div>
<div class="card"><h3>Decorator</h3><pre><code>class Coffee:
    def cost(self): return 100
class Milk:
    def __init__(self, inner): self.inner = inner
    def cost(self): return self.inner.cost() + 20
class Sugar:
    def __init__(self, inner): self.inner = inner
    def cost(self): return self.inner.cost() + 5

Sugar(Milk(Coffee())).cost()   # 125</code></pre></div>
<div class="card"><h3>Chain of responsibility (ATM)</h3><pre><code>class NoteHandler:
    def __init__(self, note, nxt=None):
        self.note, self.nxt = note, nxt
    def dispense(self, amt, out):
        n, amt = divmod(amt, self.note)
        if n: out[self.note] = n
        if amt and self.nxt: return self.nxt.dispense(amt, out)
        if amt: raise ValueError("cannot dispense")
        return out

atm = NoteHandler(2000, NoteHandler(500, NoteHandler(100)))
atm.dispense(3700, {})   # {2000: 1, 500: 3, 100: 2}</code></pre></div>

    _inst, _lock = None, threading.Lock()
    def __new__(cls):

{t:"Parking lot",d:"Easy",body:`<p><b>Entities</b>: ParkingLot → Floor → Spot; Vehicle (Bike/Car/Truck); Ticket; FeeStrategy. <b>Pattern</b>: Strategy for fees, Factory for vehicles. <b>Concurrency</b>: a lock around find-and-assign.</p><pre><code>from dataclasses import dataclass, field
from enum import Enum
import itertools, math, threading, time

class Size(Enum):
    BIKE = 1; CAR = 2; TRUCK = 3

@dataclass
class Vehicle:
    plate: str
    size: Size

@dataclass
class Spot:
    id: str
    size: Size
    vehicle: Vehicle | None = None
    def fits(self, v): return self.vehicle is None and v.size == self.size

@dataclass
class Ticket:
    id: int
    plate: str
    spot: Spot
    entry: float = field(default_factory=time.time)

class ParkingLot:
    def __init__(self, floors: list[list[Spot]], fee: "FeeStrategy"):
        self.floors, self.fee = floors, fee
        self.tickets: dict[int, Ticket] = {}
        self._ids = itertools.count(1)
        self._lock = threading.Lock()

    def park(self, v: Vehicle) -> Ticket:
        with self._lock:                         # atomic find + assign
            for floor in self.floors:
                for spot in floor:
                    if spot.fits(v):
                        spot.vehicle = v
                        t = Ticket(next(self._ids), v.plate, spot)
                        self.tickets[t.id] = t
                        return t
        raise RuntimeError("lot full")

    def unpark(self, ticket_id: int) -> int:
        with self._lock:
            t = self.tickets.pop(ticket_id)
            t.spot.vehicle = None
        hours = (time.time() - t.entry) / 3600
        return self.fee.fee(hours)</code></pre><p class="small muted">Upgrade: keep a free-spot set per (floor, size) to make park() O(1) instead of scanning.</p>`},
{t:"LRU cache",d:"Medium",body:`<p>O(1) get/put with a hash map + doubly linked list. In Python, <code>OrderedDict</code> gives you both. Mention thread safety for shared use.</p><pre><code>from collections import OrderedDict
import threading

class LRUCache:
    def __init__(self, capacity: int):
        self.cap = capacity
        self.data: OrderedDict = OrderedDict()
        self.lock = threading.Lock()

    def get(self, key):
        with self.lock:
            if key not in self.data:
                return None
            self.data.move_to_end(key)        # mark most recently used
            return self.data[key]

    def put(self, key, value):
        with self.lock:
            if key in self.data:
                self.data.move_to_end(key)
            self.data[key] = value
            if len(self.data) > self.cap:
                self.data.popitem(last=False)  # evict least recently used</code></pre><p class="small muted">Interviewers may ask you to build the linked list yourself: nodes with prev/next, sentinel head and tail, map key → node.</p>`},
{t:"Vending machine (State pattern)",d:"Medium",body:`<pre><code>class State(ABC):
    def insert(self, m, amt): raise ValueError("not now")
    def select(self, m, item): raise ValueError("not now")

class Idle(State):
    def insert(self, m, amt):
        m.balance += amt; m.state = HasMoney()

class HasMoney(State):
    def insert(self, m, amt): m.balance += amt
    def select(self, m, item):
        price = m.prices[item]
        if m.stock[item] == 0: raise ValueError("sold out")
        if m.balance < price: raise ValueError("insert more")
        m.stock[item] -= 1
        change, m.balance = m.balance - price, 0
        m.state = Idle()
        return item, change

class VendingMachine:
    def __init__(self, prices, stock):
        self.prices, self.stock = prices, stock
        self.balance, self.state = 0, Idle()
    def insert(self, amt): self.state.insert(self, amt)
    def select(self, item): return self.state.select(self, item)</code></pre>`},
{t:"Elevator system",d:"Medium",body:`<p><b>Entities</b>: ElevatorSystem, Elevator(id, current_floor, direction, stops), Request(floor, direction), Dispatcher (Strategy). <b>Scheduling</b>: SCAN/LOOK: keep moving in one direction serving stops, then reverse. <b>Dispatch strategy</b>: assign a hall call to the nearest elevator already moving toward that floor in the same direction, else the nearest idle one.</p><pre><code>class Direction(Enum): UP = 1; DOWN = -1; IDLE = 0

class Elevator:
    def __init__(self, eid):
        self.id, self.floor, self.dir = eid, 0, Direction.IDLE
        self.up, self.down = set(), set()      # pending stops
    def add_stop(self, f):
        (self.up if f > self.floor else self.down).add(f)
    def step(self):
        if self.dir != Direction.DOWN and self.up:
            self.dir = Direction.UP; self.floor += 1
            self.up.discard(self.floor)
        elif self.down:
            self.dir = Direction.DOWN; self.floor -= 1
            self.down.discard(self.floor)
        else:
            self.dir = Direction.IDLE

class NearestCarDispatcher:
    def pick(self, elevators, floor):
        return min(elevators, key=lambda e: abs(e.floor - floor))</code></pre>`},
{t:"Splitwise",d:"Hard",body:`<p><b>Entities</b>: User, Group, Expense(paid_by, amount, splits), Split (Equal/Exact/Percent via Strategy), BalanceSheet. Store <b>net balances</b> per pair; simplify debts with a greedy match of biggest creditor vs biggest debtor (two heaps).</p><pre><code>from collections import defaultdict
import heapq

class Ledger:
    def __init__(self): self.net = defaultdict(float)   # + is owed money
    def add_expense(self, payer, amount, shares: dict[str, float]):
        assert abs(sum(shares.values()) - amount) < 1e-6
        for user, share in shares.items():
            self.net[user] -= share
        self.net[payer] += amount

    def settle(self):
        cred = [(-v, u) for u, v in self.net.items() if v > 1e-9]
        debt = [(v, u) for u, v in self.net.items() if v < -1e-9]
        heapq.heapify(cred); heapq.heapify(debt)
        out = []
        while cred and debt:
            c, cu = heapq.heappop(cred); d, du = heapq.heappop(debt)
            amt = min(-c, -d)
            out.append((du, cu, round(amt, 2)))
            if -c - amt > 1e-9: heapq.heappush(cred, (c + amt, cu))
            if -d - amt > 1e-9: heapq.heappush(debt, (d + amt, du))
        return out   # list of (from, to, amount)</code></pre><p class="small muted">Use integer paise in production, not floats.</p>`},
{t:"Movie ticket booking (concurrency)",d:"Hard",body:`<p><b>Entities</b>: Movie, Theatre, Screen, Show, Seat, Booking, SeatLock. <b>Key problem</b>: two users selecting the same seat. Hold seats with an expiry under a lock, confirm on payment.</p><pre><code>class SeatLockManager:
    def __init__(self, ttl=600):
        self.ttl, self.locks, self.mu = ttl, {}, threading.Lock()   # (show, seat) -> (user, expiry)

    def lock(self, show, seats, user):
        now = time.time()
        with self.mu:
            for s in seats:
                held = self.locks.get((show, s))
                if held and held[1] > now and held[0] != user:
                    return False                          # someone else holds it
            for s in seats:
                self.locks[(show, s)] = (user, now + self.ttl)
            return True

    def confirm(self, show, seats, user, booked: set):
        with self.mu:
            now = time.time()
            if any(self.locks.get((show, s), (None, 0))[0] != user
                   or self.locks[(show, s)][1] < now for s in seats):
                raise ValueError("hold expired")
            for s in seats:
                booked.add((show, s)); del self.locks[(show, s)]</code></pre><p class="small muted">Also check <code>booked</code> inside lock(). In a real system this maps to a DB conditional update or Redis SET NX with TTL.</p>`}

/* ---------- diagrams ---------- */
const KIND={client:"client",edge:"edge",svc:"svc",db:"db",cache:"cache",queue:"queue",ext:"ext"};
function diagram(spec,cap){
  if(!spec)return"";
  const W=spec.w||760,H=spec.h||340,bw=spec.bw||128;const nodes={};
  spec.n.forEach(([id,x,y,label,sub,kind])=>nodes[id]={x,y,label,sub,kind:KIND[kind]||"svc",h:sub?48:38});
  let out=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cap||"Architecture diagram")}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--muted)"/></marker></defs>`;
  (spec.e||[]).forEach(([a,b,label,dash,both])=>{
    const A=nodes[a],B=nodes[b];if(!A||!B)return;
    const dx=B.x-A.x,dy=B.y-A.y;
    const clip=(N,sx,sy)=>{const hw=bw/2+3,hh=N.h/2+3;const t=Math.min(Math.abs(sx)>1e-6?hw/Math.abs(sx):1e9,Math.abs(sy)>1e-6?hh/Math.abs(sy):1e9);return[sx*t,sy*t];};
    const [ax,ay]=clip(A,dx,dy),[bx,by]=clip(B,-dx,-dy);
    const x1=A.x+ax,y1=A.y+ay,x2=B.x+bx,y2=B.y+by;
    out+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" style="stroke:var(--muted);stroke-width:1.5${dash?";stroke-dasharray:5 4":""}" marker-end="url(#ah)"${both?' marker-start="url(#ah)"':""}/>`;
    if(label){const mx=(x1+x2)/2,my=(y1+y2)/2;out+=`<text x="${mx.toFixed(1)}" y="${(my-4).toFixed(1)}" text-anchor="middle" style="font:600 10.5px Figtree,system-ui,sans-serif;fill:var(--muted);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round">${esc(label)}</text>`;}
  });
  Object.values(nodes).forEach(N=>{
    const x=N.x-bw/2,y=N.y-N.h/2,k=N.kind;
    const fill=`var(--n-${k})`,stroke=`var(--n-${k}-s)`;
    if(k==="db"){out+=`<path d="M${x} ${y+7} q0 -7 ${bw/2} -7 q${bw/2} 0 ${bw/2} 7 v${N.h-14} q0 7 ${-bw/2} 7 q${-bw/2} 0 ${-bw/2} -7z" style="fill:${fill};stroke:${stroke};stroke-width:1.5"/><path d="M${x} ${y+7} q${bw/2} 9 ${bw} 0" style="fill:none;stroke:${stroke};stroke-width:1.2;opacity:.7"/>`;}
    else if(k==="queue"){out+=`<rect x="${x}" y="${y}" width="${bw}" height="${N.h}" rx="6" style="fill:${fill};stroke:${stroke};stroke-width:1.5"/>`;for(let i=1;i<4;i++)out+=`<line x1="${x+bw-8*i}" y1="${y+5}" x2="${x+bw-8*i}" y2="${y+N.h-5}" style="stroke:${stroke};stroke-width:1;opacity:.45"/>`;}
    else out+=`<rect x="${x}" y="${y}" width="${bw}" height="${N.h}" rx="${k==="client"?19:10}" style="fill:${fill};stroke:${stroke};stroke-width:1.5"/>`;
    out+=`<text x="${N.x}" y="${N.y+(N.sub?-3:4)}" text-anchor="middle" style="font:700 12px Figtree,system-ui,sans-serif;fill:var(--ink)">${esc(N.label)}</text>`;
    if(N.sub)out+=`<text x="${N.x}" y="${N.y+13}" text-anchor="middle" style="font:500 10px Figtree,system-ui,sans-serif;fill:var(--muted)">${esc(N.sub)}</text>`;
  });
  out+="</svg>";
  const used=[...new Set(Object.values(nodes).map(n=>n.kind))];
  const names={client:"Client",edge:"Edge / routing",svc:"Service / worker",db:"Database / storage",cache:"Cache",queue:"Queue / stream",ext:"External / AI"};
  return `<figure class="diagram" style="margin:12px 0">${out}<div class="legend">${used.map(k=>`<span><i style="background:var(--n-${k});border:1.5px solid var(--n-${k}-s)"></i>${names[k]}</span>`).join("")}</div>${cap?`<figcaption class="cap">${esc(cap)}</figcaption>`:""}</figure>`;
}

function quizHTML(qs,prefix){

function wireQuiz(root,qs,prefix,onDone,ids){
  let answered=0;
  $$(".q",root).forEach((box,i)=>{
    const q=qs[i];
    $$(".opt",box).forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j;const right=j===q.a;
      $$(".opt",box).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add("right");});
      if(!right)b.classList.add("wrong");
      $(".why",box).classList.remove("hidden");
      $(".why",box).insertAdjacentHTML("afterbegin",right?`<b style="color:var(--good)">Correct.</b> `:`<b style="color:var(--bad)">Not quite.</b> `);
      S.stats.quizAns++;
      if(right){S.stats.quizRight++;S.stats.combo++;S.stats.maxCombo=Math.max(S.stats.maxCombo,S.stats.combo);
        const id=ids?ids[i]:prefix+i;const t=today();if(S.qDay.date!==t)S.qDay={date:t,ids:{}};
        bump("quiz");
        if(!S.qDay.ids[id]){S.qDay.ids[id]=1;addXP(S.stats.combo>=5?15:10,S.stats.combo>=3?`Correct · combo x${S.stats.combo}`:"Correct answer");}else{save();checkBadges();renderHud();}
      }else{S.stats.combo=0;const mid=ids?ids[i]:prefix+i;if(window.SQ.addMistake&&/^t:/.test(mid)){window.SQ.addMistake(mid);$(".why",box).insertAdjacentHTML("beforeend",' <span class="small muted">· Saved to your <a href="#weak">weak spots</a>.</span>');}save();}
      answered++;if(answered===qs.length&&onDone)onDone();
    });
  });
}

/* Estimation gym */
function genDrill(){
  const R=Math.random;const pickN=a=>a[Math.floor(R()*a.length)];
  const kinds=[
    ()=>{const dau=pickN([10,50,100,200,500]);const r=pickN([5,10,20,50]);const v=dau*1e6*r/86400;return{q:`${dau}M daily active users each make ${r} requests a day. What's the <b>average QPS</b>?`,unit:"requests/sec",ans:v,work:`${dau}M × ${r} = ${(dau*r).toLocaleString()}M requests/day. ÷ 86,400 s ≈ <b>${Math.round(v).toLocaleString()}/s</b>. Shortcut: ÷ 10⁵ gives ${Math.round(dau*r*10).toLocaleString()}/s. Peak ≈ 2–3× that.`};},
    ()=>{const n=pickN([1,5,10,50,100]);const kb=pickN([1,2,5,100,500]);const y=pickN([1,5,10]);const tb=n*1e6*kb*1e3*365*y/1e12;return{q:`You store ${n}M new records a day, ${kb} KB each, for ${y} year${y>1?"s":""}. How much storage in <b>TB</b> (no replication)?`,unit:"TB",ans:tb,work:`${n}M × ${kb} KB = ${(n*kb).toLocaleString()} GB/day. × 365 × ${y} = ${(n*kb*365*y).toLocaleString()} GB ≈ <b>${tb.toFixed(tb<10?2:0)} TB</b>. With 3× replication, triple it.`};},
    ()=>{const qps=pickN([1000,5000,20000,100000]);const kb=pickN([10,50,200,1000]);const v=qps*kb*8/1e6;return{q:`A service serves ${qps.toLocaleString()} requests/sec with ${kb} KB responses. Egress bandwidth in <b>Gbps</b>?`,unit:"Gbps",ans:v,work:`${qps.toLocaleString()} × ${kb} KB = ${(qps*kb/1000).toLocaleString()} MB/s. × 8 bits = <b>${v.toFixed(v<10?2:0)} Gbps</b>.`};},
    ()=>{const reads=pickN([100,500,1000]);const kb=pickN([1,2,5]);const v=reads*1e6*0.2*kb*1e3/1e9;return{q:`You serve ${reads}M reads a day of ${kb} KB objects. Using the 80/20 rule (cache the hottest 20% of a day's reads), how big is the cache in <b>GB</b>?`,unit:"GB",ans:v,work:`${reads}M × 20% = ${reads*0.2}M objects × ${kb} KB = <b>${v.toFixed(0)} GB</b>. That fits in a few Redis nodes (or one big one).`};},
    ()=>{const peak=pickN([20000,50000,100000,300000]);const per=pickN([1000,2000,5000]);const v=Math.ceil(peak/per);return{q:`Peak load is ${peak.toLocaleString()} QPS and one app server handles ~${per.toLocaleString()} QPS. How many <b>servers</b> at minimum?`,unit:"servers",ans:v,work:`${peak.toLocaleString()} ÷ ${per.toLocaleString()} = <b>${v}</b>. In an interview add 20–30% headroom and N+1 for failure: about ${Math.ceil(v*1.3)+1}.`};},
    ()=>{const urls=pickN([100,500,1000]);const v=urls*1e6*365*5;const chars=Math.ceil(Math.log(v)/Math.log(62));return{q:`A URL shortener creates ${urls}M links per day, kept for 5 years. How many <b>base62 characters</b> do the short codes need?`,unit:"characters",ans:chars,exact:true,work:`${urls}M × 365 × 5 ≈ ${(v/1e9).toFixed(0)} billion links. 62⁶ ≈ 56.8 billion, 62⁷ ≈ 3.5 trillion, 62⁸ ≈ 218 trillion. Smallest that fits: <b>${chars}</b>.`};}
  ];
  return pickN(kinds)();
}
V.gym=function(el){
  let d=genDrill();
  el.innerHTML=`<div class="row"><a class="small" href="#practice">← Gym</a></div><div class="page-head"><div><div class="eyebrow">Estimation gym</div><h1>Napkin math reps</h1><p>Interviewers want the right order of magnitude and clear steps, not decimals. Within ±30% counts as a hit.</p></div><span class="chip">${S().stats.drillsRight} hits so far</span></div>

/* ---------- Spaced review queue ---------- */
const STEP_NAME=["1-day","3-day","7-day","16-day","35-day"];
V.review=function(el){
  const SR=S().srs,steps=window.SQ.SRS_STEPS;
  const ids=Object.keys(SR).filter(id=>TOPICS.some(t=>t.id===id));
  const due=window.SQ.srsDue();
  const mastered=ids.filter(id=>SR[id].done).length;
  const pass=S().stats.revPass,miss=S().stats.revMiss;
  const sess=V.review.s;
  if(sess&&sess.i<sess.q.length){runSession(el);return;}
  if(sess){V.review.s=null;}
  // 14-day forecast
  const t=today();const fc=Array.from({length:14},(_,i)=>{const k=window.SQ.addDays(t,i);const n=ids.filter(id=>!SR[id].done&&(i===0?SR[id].due<=k:SR[id].due===k)).length;return {k,n};});
  const mx=Math.max(1,...fc.map(f=>f.n));
  const rows=ids.map(id=>({t:TOPICS.find(x=>x.id===id),r:SR[id]})).sort((a,b)=>(a.r.done?1:0)-(b.r.done?1:0)||String(a.r.due).localeCompare(String(b.r.due)));
  el.innerHTML=`<div class="page-head"><div><div class="eyebrow">Review queue</div><h1>${due.length?`${due.length} topic${due.length>1?"s":""} due today`:ids.length?"Nothing due. Memory intact.":"Your review queue starts here"}</h1><p>Topics come back after <b>1, 3, 7, 16 and 35 days</b>. Passing pushes a topic further out; missing brings it back tomorrow. This is how the material stays with you after today.</p></div>
  ${due.length?`<button class="btn primary" id="startRv">Start review · ${due.length}</button>`:`<a class="btn" href="#revise">Fast revision</a>`}</div>
  <div class="ladder card">${steps.map((d,i)=>`<div class="lstep"><b>Day ${d}</b><span>${(n=>n+" topic"+(n===1?"":"s"))(ids.filter(id=>!SR[id].done&&SR[id].step===i).length)}</span></div>`).join('<i class="larr">→</i>')}<i class="larr">→</i><div class="lstep gold"><b>Mastered</b><span>${mastered} topic${mastered===1?"":"s"}</span></div></div>
  <div class="grid g4" style="margin-top:14px"><div class="card stat"><b>${due.length}</b><span>Due now</span></div><div class="card stat"><b>${ids.length-mastered}</b><span>On the ladder</span></div><div class="card stat"><b>${mastered}</b><span>Mastered</span></div><div class="card stat"><b>${pass+miss?Math.round(pass/(pass+miss)*100)+"%":"–"}</b><span>Pass rate (${pass+miss} reviews)</span></div></div>
  <div class="sect"><h2>Next 14 days</h2><span class="small muted">Today includes anything overdue</span></div>
  <div class="card forecast">${fc.map((f,i)=>`<div class="fc ${i===0?"today":""}" title="${f.k}: ${f.n} due"><span class="fn">${f.n||""}</span><i style="height:${f.n?Math.max(10,f.n/mx*100):3}%"></i><small>${i===0?"Today":window.SQ.dateOf(f.k).toLocaleDateString(undefined,{weekday:"narrow"})}</small></div>`).join("")}</div>
  <div class="sect"><h2>How a review works</h2></div>
  <div class="grid g3"><div class="card"><b>1. Recall</b><p class="small muted" style="margin:4px 0 0">See only the title. Say the TL;DR and one trade-off out loud, then reveal the summary.</p></div><div class="card"><b>2. Prove it</b><p class="small muted" style="margin:4px 0 0">Answer up to 3 questions from that topic. Pass with at most one wrong.</p></div><div class="card"><b>3. Reschedule</b><p class="small muted" style="margin:4px 0 0">Pass: next gap (+15 XP). Miss: back tomorrow at the 1-day step (+5 XP). Overdue topics wait for you; they're not counted as misses.</p></div></div>
  <div class="sect"><h2>Every topic on the ladder</h2><span class="small muted">${ids.length} of ${TOPICS.length} topics enrolled · clear topics in the Learn path to add more</span></div>
  ${rows.length?`<div class="card tscroll"><table class="tbl"><tr><th>Topic</th><th>Progress</th><th>Next review</th><th>Last result</th></tr>${rows.map(({t:x,r})=>{const last=r.hist[r.hist.length-1];return `<tr><td><a href="#topic-${x.id}">${esc(x.title)}</a></td><td><span class="rpips">${steps.map((_,i)=>`<i class="${r.done||i<r.step?"on":i===r.step?"cur":""}"></i>`).join("")}</span></td><td>${r.done?`<span class="tag easy">Mastered ${r.done}</span>`:r.due<=t?`<span class="tag due">Due${r.due<t?" (overdue)":""}</span>`:fmt(r.due)}</td><td>${last?(last.p?`<span style="color:var(--good)">Passed</span>`:`<span style="color:var(--bad)">Missed</span>`)+` <span class="small muted">${last.d}</span>`:`<span class="small muted">First review pending</span>`}</td></tr>`;}).join("")}</table></div>`:`<div class="card" style="text-align:center;padding:28px"><h3>Your queue is empty</h3><p class="muted">Clear a topic in the Learn path and it shows up here tomorrow.</p><a class="btn primary" href="#path">Open the Learn path</a></div>`}`;
  const sb=$("#startRv");if(sb)sb.onclick=()=>{V.review.s={q:due.map(x=>x.id),i:0,pass:0,miss:0};window.SQ.render();};
};

function runSession(el){
  const s=V.review.s;const t=TOPICS.find(x=>x.id===s.q[s.i]);const w=WORLDS.find(x=>x.n===t.w);const r=S().srs[t.id];
  const rnd=window.SQ.shuffle(t.quiz.map((q,i)=>i)).slice(0,3);const qs=rnd.map(i=>t.quiz[i]);
  const allowed=qs.length>=3?1:0;
  const h=heads(t.notes);
  el.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="quitRv">← End session</button><span class="small muted">Topic ${s.i+1} of ${s.q.length} · ${s.pass} passed · ${s.miss} missed</span></div>
  <div class="bar" style="margin:10px 0 16px"><i style="width:${s.i/s.q.length*100}%"></i></div>
  <div class="card rv-session" style="--wc:${w.c}">
    <div class="row"><span class="tag" style="background:${w.c};color:#fff">Module ${w.n} · ${esc(w.name)}</span><span class="tag">${STEP_NAME[Math.min(r.step,4)]} review</span>${r.due<today()?'<span class="tag due">Overdue</span>':""}</div>
    <h1 style="margin:10px 0 4px">${esc(t.title)}</h1>
    <div id="rcl"><p class="muted">Before you look: say the TL;DR out loud and name one trade-off or trap.</p><button class="btn primary" id="reveal">I've said it · reveal</button></div>
    <div id="sum" class="hidden"><p class="rv-tldr">${t.tldr}</p>${h.length?`<div class="rv-k"><span>Key ideas</span>${h.map(x=>`<i>${x}</i>`).join("")}</div>`:""}${t.traps&&t.traps.length?`<div class="rv-l trap"><span>Traps</span><ul>${t.traps.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}</div>
  </div>
  <div id="rq" class="hidden"><div class="sect"><h2>Prove it</h2><span class="small muted">${qs.length} question${qs.length>1?"s":""} · pass with ${allowed?"at most one wrong":"all right"}</span></div>
  ${qs.map((q,i)=>`<div class="q" data-i="${i}"><div class="qt">${i+1}. ${q.q}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div><div class="why hidden">${q.why||""}</div></div>`).join("")}</div>
  <div id="verdict"></div>`;
  $("#quitRv").onclick=()=>{V.review.s=null;window.SQ.render();};
  $("#reveal").onclick=()=>{$("#rcl").classList.add("hidden");$("#sum").classList.remove("hidden");$("#rq").classList.remove("hidden");$("#rq").scrollIntoView({behavior:"smooth",block:"start"});};
  let answered=0,wrong=0;
  $$("#rq .q",el).forEach((box,i)=>{const q=qs[i];$$(".opt",box).forEach(b=>b.onclick=()=>{
    const right=+b.dataset.j===q.a;$$(".opt",box).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add("right");});
    if(!right){b.classList.add("wrong");wrong++;if(window.SQ.addMistake)window.SQ.addMistake("t:"+t.id+":"+rnd[i]);}
    const why=$(".why",box);why.classList.remove("hidden");why.insertAdjacentHTML("afterbegin",right?`<b style="color:var(--good)">Correct.</b> `:`<b style="color:var(--bad)">Not quite.</b> `);
    answered++;if(answered===qs.length)finish(wrong<=allowed);
  });});
  function finish(ok){
    window.SQ.srsGrade(t.id,ok);const nr=S().srs[t.id];
    if(ok)s.pass++;else s.miss++;
    window.SQ.bump("topic");window.SQ.addXP(ok?15:5,ok?`Review passed: ${t.title}`:`Review attempted: ${t.title}`);
    if(ok&&nr.done){window.SQ.confetti(90);}
    const last=s.i+1>=s.q.length;
    $("#verdict").innerHTML=`<div class="card verdict ${ok?"pass":"miss"}"><div><h2>${ok?(nr.done?"Mastered! It survived 35 days.":"Passed"):"Missed: back tomorrow"}</h2><p class="small" style="margin:4px 0 0">${ok?(nr.done?"This topic leaves the queue. Revisit it in Fast revision before interviews.":`Next review in ${window.SQ.SRS_STEPS[nr.step]} days, on ${fmt(nr.due)}.`):`It restarts at the 1-day step. Skim the <a href="#topic-${t.id}">full notes</a> tonight.`}</p></div><button class="btn primary" id="nextRv">${last?"Finish session":"Next topic →"}</button></div>`;
    $("#verdict").scrollIntoView({behavior:"smooth",block:"nearest"});
    $("#nextRv").onclick=()=>{s.i++;if(last){const p=s.pass,m=s.miss;V.review.s=null;if(p+m)window.SQ.modal(`<div class="eyebrow">Review session done</div><h2>${p} passed · ${m} missed</h2><p>${m?"Missed topics come back tomorrow. ":""}Come back when the queue fills up again. The badge on the sidebar shows what's due.</p>`);if(!m&&p>=3)window.SQ.confetti(80);}
      window.SQ.render();};
  }
}
})();

/* ===== Schema design exercises + runnable SQL practice ===== */
const SCHEMAS=[
{id:"library",title:"Library management",diff:"Easy",
prompt:"Design the tables for a college library. Members borrow books, return them late sometimes, and pay fines. The library owns several copies of popular books.",
reqs:["Search books by title, author or ISBN","A book can have many physical copies","Track who has which copy and when it's due","Find a member's current loans and overdue ones","Record fines"],
hints:["Is a \"book\" the same thing as the physical copy on the shelf?","A loan connects a member to a copy for a period of time. What columns does it need to tell 'active' from 'returned'?","Which query will run all day at the counter? Index for that."],
answer:`<pre><code>CREATE TABLE members (
  id          BIGSERIAL PRIMARY KEY,
  name        TEXT NOT NULL,
  email       TEXT UNIQUE NOT NULL,
  joined_on   DATE NOT NULL DEFAULT CURRENT_DATE
);
CREATE TABLE books (            -- the title (one row per ISBN)
  id      BIGSERIAL PRIMARY KEY,
  isbn    TEXT UNIQUE NOT NULL,
  title   TEXT NOT NULL,
  author  TEXT NOT NULL
);
CREATE TABLE book_copies (      -- the physical item on the shelf
  id       BIGSERIAL PRIMARY KEY,
  book_id  BIGINT NOT NULL REFERENCES books(id),
  barcode  TEXT UNIQUE NOT NULL,
  status   TEXT NOT NULL DEFAULT 'available'  -- available | on_loan | lost
);
CREATE TABLE loans (
  id           BIGSERIAL PRIMARY KEY,
  copy_id      BIGINT NOT NULL REFERENCES book_copies(id),
  member_id    BIGINT NOT NULL REFERENCES members(id),
  borrowed_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
  due_on       DATE NOT NULL,
  returned_at  TIMESTAMPTZ            -- NULL while the book is out
);
CREATE TABLE fines (
  id        BIGSERIAL PRIMARY KEY,
  loan_id   BIGINT NOT NULL REFERENCES loans(id),
  amount    NUMERIC(8,2) NOT NULL CHECK (amount &gt; 0),
  paid_at   TIMESTAMPTZ
);
CREATE INDEX ON loans (member_id) WHERE returned_at IS NULL;   -- "my current loans"
CREATE UNIQUE INDEX ON loans (copy_id) WHERE returned_at IS NULL; -- a copy can't be lent twice
CREATE INDEX ON books (title);</code></pre>`,
why:["<b>Book vs copy</b> is the key insight: title data lives once in <code>books</code>; each shelf item is a <code>book_copies</code> row.","<code>returned_at IS NULL</code> means \"still out\", so you never delete loans and keep full history.","The <b>partial unique index</b> makes the database itself refuse to lend the same copy twice, even if two librarians click at once.","Fines hang off a loan, so you always know which late return caused them. Money uses <code>NUMERIC</code>, never <code>FLOAT</code>."],
check:["Separate tables for the book title and the physical copy","A loans table with due date and a nullable returned date","Foreign keys from loans to member and copy","An index for a member's active loans","Money stored as NUMERIC / integer paise, not float"]},

{id:"instagram",title:"Instagram-style photo app",diff:"Medium",
prompt:"Design the core tables for a photo-sharing app: users post photos with captions, follow each other, like and comment on posts. The home feed shows recent posts from people you follow.",
reqs:["Users can follow and unfollow others","Posts with an image and caption","Likes (one per user per post) and comments","Show like and comment counts fast","A user's profile grid, newest first"],
hints:["A follow is a relationship between two users. What's its primary key?","How do you stop the same user liking a post twice, without extra code?","Counting likes on every page view is slow. What could you store instead?"],
answer:`<pre><code>CREATE TABLE users (
  id          BIGINT PRIMARY KEY,          -- Snowflake-style ID
  username    TEXT UNIQUE NOT NULL,
  bio         TEXT,
  created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE TABLE follows (
  follower_id  BIGINT NOT NULL REFERENCES users(id),
  followee_id  BIGINT NOT NULL REFERENCES users(id),
  created_at   TIMESTAMPTZ NOT NULL DEFAULT now(),
  PRIMARY KEY (follower_id, followee_id)   -- no duplicate follows
);
CREATE INDEX ON follows (followee_id);      -- "who follows me?"
CREATE TABLE posts (
  id             BIGINT PRIMARY KEY,
  user_id        BIGINT NOT NULL REFERENCES users(id),
  image_key      TEXT NOT NULL,             -- object-storage key, not the image
  caption        TEXT,
  like_count     INT NOT NULL DEFAULT 0,    -- denormalised counter
  comment_count  INT NOT NULL DEFAULT 0,
  created_at     TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE INDEX ON posts (user_id, created_at DESC);   -- profile grid
CREATE TABLE likes (
  user_id     BIGINT NOT NULL REFERENCES users(id),
  post_id     BIGINT NOT NULL REFERENCES posts(id),
  created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
  PRIMARY KEY (post_id, user_id)            -- one like per user per post
);
CREATE TABLE comments (
  id          BIGINT PRIMARY KEY,
  post_id     BIGINT NOT NULL REFERENCES posts(id),
  user_id     BIGINT NOT NULL REFERENCES users(id),
  body        TEXT NOT NULL,
  created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE INDEX ON comments (post_id, created_at);</code></pre>`,
why:["<b>Composite primary keys</b> on <code>follows</code> and <code>likes</code> make duplicates impossible.","The image itself lives in object storage (S3); the row stores only its key.","<code>like_count</code> is <b>denormalised</b>: update it in the same transaction as the like insert (or asynchronously), so reading a post never runs <code>COUNT(*)</code>.","The index <code>(user_id, created_at DESC)</code> serves the profile grid directly. The home feed itself is usually a precomputed list in Redis (see the News feed problem), not a giant SQL join."],
check:["follows table with a composite primary key","likes with a composite key (or unique constraint) on post + user","Images stored as an object-storage key, not a blob in the DB","Some answer for fast counts (denormalised counter or cache)","Index on posts by user and time"]},

{id:"chat",title:"WhatsApp-style chat",diff:"Medium",
prompt:"Design tables for one-to-one and group chats. Messages must come back in order, and each person should see which messages are unread.",
reqs:["1:1 and group conversations","Members can join and leave groups","Load the latest 50 messages, then scroll up","Unread count per conversation per user","Delivered / read ticks"],
hints:["Can a 1:1 chat just be a conversation with two members?","Storing a 'read' flag per message per member explodes in big groups. What single value per member could replace it?","Which column pair do you page on?"],
answer:`<pre><code>CREATE TABLE conversations (
  id          BIGINT PRIMARY KEY,
  kind        TEXT NOT NULL CHECK (kind IN ('direct','group')),
  title       TEXT,                         -- NULL for direct chats
  created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE TABLE conversation_members (
  conversation_id       BIGINT NOT NULL REFERENCES conversations(id),
  user_id               BIGINT NOT NULL REFERENCES users(id),
  joined_at             TIMESTAMPTZ NOT NULL DEFAULT now(),
  left_at               TIMESTAMPTZ,
  last_read_message_id  BIGINT,             -- read pointer
  PRIMARY KEY (conversation_id, user_id)
);
CREATE INDEX ON conversation_members (user_id);   -- "my chats"
CREATE TABLE messages (
  conversation_id  BIGINT NOT NULL REFERENCES conversations(id),
  id               BIGINT NOT NULL,         -- time-sortable (Snowflake)
  sender_id        BIGINT NOT NULL REFERENCES users(id),
  body             TEXT,
  created_at       TIMESTAMPTZ NOT NULL DEFAULT now(),
  PRIMARY KEY (conversation_id, id)
);
-- newest 50:  WHERE conversation_id = $1 ORDER BY id DESC LIMIT 50
-- scroll up:  ... AND id &lt; $last_seen_id ORDER BY id DESC LIMIT 50</code></pre>`,
why:["A 1:1 chat is just a <code>direct</code> conversation with two members, so one model covers both.","<b>Read pointer</b>: <code>last_read_message_id</code> per member. Unread count = messages with a higher ID. No per-message read rows, so big groups stay cheap.","Primary key <code>(conversation_id, id)</code> keeps a chat's messages together and makes cursor pagination fast. This is the same reason Discord partitions messages by channel.","At WhatsApp scale, <code>messages</code> moves to a wide-column store (Cassandra) partitioned by conversation, but the shape stays the same."],
check:["Conversations and members as separate tables","Direct and group chats handled by one model","A per-member read pointer (not a row per message per reader)","Messages keyed by conversation + a sortable ID","Cursor (keyset) pagination, not OFFSET"]},

{id:"food-delivery",title:"Food delivery (Swiggy/Zomato)",diff:"Medium",
prompt:"Design the tables behind ordering food: restaurants with menus, customers with saved addresses, orders with items, and delivery partners.",
reqs:["Restaurants, menus with prices that change over time","Customers with several saved addresses","An order has many items and moves through statuses","Assign a delivery partner to an order","Past orders must show the price actually paid"],
hints:["If a dish's price changes tomorrow, what should yesterday's order show?","Should the order point to the customer's address row, or copy it?","Where does the live GPS location of a rider belong: here, or somewhere else?"],
answer:`<pre><code>CREATE TABLE restaurants (
  id BIGSERIAL PRIMARY KEY, name TEXT NOT NULL, city TEXT NOT NULL,
  lat NUMERIC(9,6), lng NUMERIC(9,6), is_open BOOLEAN NOT NULL DEFAULT true
);
CREATE TABLE menu_items (
  id BIGSERIAL PRIMARY KEY,
  restaurant_id BIGINT NOT NULL REFERENCES restaurants(id),
  name TEXT NOT NULL, price_paise INT NOT NULL CHECK (price_paise &gt; 0),
  is_veg BOOLEAN NOT NULL, is_available BOOLEAN NOT NULL DEFAULT true
);
CREATE TABLE customers (id BIGSERIAL PRIMARY KEY, name TEXT, phone TEXT UNIQUE NOT NULL);
CREATE TABLE addresses (
  id BIGSERIAL PRIMARY KEY, customer_id BIGINT NOT NULL REFERENCES customers(id),
  label TEXT, line1 TEXT NOT NULL, lat NUMERIC(9,6), lng NUMERIC(9,6)
);
CREATE TABLE delivery_partners (id BIGSERIAL PRIMARY KEY, name TEXT, phone TEXT UNIQUE, vehicle TEXT);
CREATE TABLE orders (
  id BIGSERIAL PRIMARY KEY,
  customer_id BIGINT NOT NULL REFERENCES customers(id),
  restaurant_id BIGINT NOT NULL REFERENCES restaurants(id),
  delivery_partner_id BIGINT REFERENCES delivery_partners(id),  -- NULL until assigned
  status TEXT NOT NULL,     -- placed | accepted | picked_up | delivered | cancelled
  delivery_address JSONB NOT NULL,     -- snapshot, not a pointer
  total_paise INT NOT NULL,
  created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE TABLE order_items (
  order_id BIGINT NOT NULL REFERENCES orders(id),
  menu_item_id BIGINT NOT NULL REFERENCES menu_items(id),
  qty INT NOT NULL CHECK (qty &gt; 0),
  unit_price_paise INT NOT NULL,      -- price at the time of ordering
  PRIMARY KEY (order_id, menu_item_id)
);
CREATE INDEX ON orders (customer_id, created_at DESC);
CREATE INDEX ON orders (restaurant_id, status);</code></pre>`,
why:["<b>Snapshot what was true at order time</b>: <code>unit_price_paise</code> and <code>delivery_address</code> are copied into the order, so editing a menu or an address never rewrites history.","Money in integer <b>paise</b> avoids rounding errors.","The rider's live location changes every few seconds. It belongs in Redis (GEO) or a location service, not in an <code>UPDATE</code> on this table.","Index <code>(restaurant_id, status)</code> powers the restaurant's \"new orders\" screen."],
check:["order_items stores the price at the time of order","Delivery address copied into the order (or an immutable address row)","Order status column with clear states","Delivery partner as a nullable foreign key","Live rider location kept out of the main SQL tables"]},

{id:"booking",title:"Movie seat booking",diff:"Hard",
prompt:"Design the tables for booking cinema seats. Thousands of people try to grab seats for a popular show at the same second. A seat is held for 10 minutes while the user pays, and must never be sold twice.",
reqs:["Theatres, screens, a fixed seat layout per screen","Shows (a movie on a screen at a time)","Hold seats for 10 minutes during payment","Never double-sell a seat","Release holds automatically when they expire"],
hints:["Seat layout belongs to the screen, but availability belongs to the show. Which table joins them?","How can one UPDATE statement both check and claim a seat atomically?","What happens to a hold if the user just closes the tab?"],
answer:`<pre><code>CREATE TABLE screens (id BIGSERIAL PRIMARY KEY, theatre_id BIGINT NOT NULL, name TEXT);
CREATE TABLE seats (
  id BIGSERIAL PRIMARY KEY, screen_id BIGINT NOT NULL REFERENCES screens(id),
  row_label TEXT NOT NULL, number INT NOT NULL, tier TEXT NOT NULL,
  UNIQUE (screen_id, row_label, number)
);
CREATE TABLE shows (
  id BIGSERIAL PRIMARY KEY, screen_id BIGINT NOT NULL REFERENCES screens(id),
  movie_id BIGINT NOT NULL, starts_at TIMESTAMPTZ NOT NULL
);
CREATE TABLE show_seats (            -- one row per seat per show
  show_id     BIGINT NOT NULL REFERENCES shows(id),
  seat_id     BIGINT NOT NULL REFERENCES seats(id),
  status      TEXT NOT NULL DEFAULT 'free',   -- free | held | booked
  held_by     BIGINT,                          -- user id
  hold_expires_at TIMESTAMPTZ,
  booking_id  BIGINT,
  price_paise INT NOT NULL,
  PRIMARY KEY (show_id, seat_id)
);
CREATE TABLE bookings (
  id BIGSERIAL PRIMARY KEY, user_id BIGINT NOT NULL, show_id BIGINT NOT NULL,
  status TEXT NOT NULL,        -- pending | confirmed | cancelled
  idempotency_key TEXT UNIQUE NOT NULL, total_paise INT NOT NULL,
  created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);
-- Claim a seat atomically (0 rows updated = someone else got it):
UPDATE show_seats
   SET status='held', held_by=$user, hold_expires_at=now() + interval '10 minutes'
 WHERE show_id=$show AND seat_id=$seat
   AND (status='free' OR (status='held' AND hold_expires_at &lt; now()));</code></pre>`,
why:["<code>show_seats</code> is the heart: the layout comes from <code>seats</code>, availability is per show.","The <b>conditional UPDATE</b> is checked and applied in one atomic step, so two people can't both win. No separate SELECT-then-UPDATE race.","Expired holds count as free inside the WHERE clause, so a closed tab needs no cleanup job for correctness (a sweeper can still tidy up).","<code>idempotency_key</code> on bookings stops a double charge when the payment callback retries."],
check:["A per-show seat table (show_seats), separate from the screen layout","Status with held / booked and a hold expiry time","An atomic conditional update or row lock to claim seats","Idempotency key on bookings or payments","Expired holds treated as free"]},

{id:"ledger",title:"Wallet and payments ledger",diff:"Hard",
prompt:"Design the tables for a wallet app (like Paytm wallet): users top up, pay merchants and get refunds. Balances must always be correct and fully auditable.",
reqs:["Each user and merchant has a balance","Top-ups, payments, refunds","Never lose or create money","A full history that auditors can replay","Retries must not double-charge"],
hints:["Is a balance column the source of truth, or is it derived from something?","In double-entry bookkeeping, what must every transaction add up to?","Where does a client's retry get recognised as a duplicate?"],
answer:`<pre><code>CREATE TABLE accounts (
  id BIGSERIAL PRIMARY KEY,
  owner_type TEXT NOT NULL,     -- user | merchant | system (bank, fees)
  owner_id BIGINT NOT NULL,
  currency CHAR(3) NOT NULL DEFAULT 'INR',
  balance_paise BIGINT NOT NULL DEFAULT 0,   -- cached, derived from entries
  UNIQUE (owner_type, owner_id, currency)
);
CREATE TABLE transactions (
  id BIGSERIAL PRIMARY KEY,
  kind TEXT NOT NULL,             -- topup | payment | refund
  idempotency_key TEXT UNIQUE NOT NULL,
  created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE TABLE ledger_entries (     -- append-only, never UPDATE or DELETE
  id BIGSERIAL PRIMARY KEY,
  transaction_id BIGINT NOT NULL REFERENCES transactions(id),
  account_id BIGINT NOT NULL REFERENCES accounts(id),
  amount_paise BIGINT NOT NULL    -- +credit / -debit
);
CREATE INDEX ON ledger_entries (account_id, id);
-- Rule: for every transaction, SUM(amount_paise) = 0.
-- Payment of ₹250: user account -25000, merchant account +25000,
-- written in ONE database transaction together with both balance updates.</code></pre>`,
why:["<b>Double-entry</b>: money only moves between accounts, so every transaction's entries sum to zero. That makes lost or invented money detectable.","<code>ledger_entries</code> is <b>append-only</b>: a refund is a new transaction, never an edit. Auditors can replay history to rebuild any balance.","<code>balance_paise</code> is a cache for fast reads, updated in the same DB transaction as the entries (with a row lock or a <code>CHECK (balance_paise &gt;= 0)</code> to stop overdrafts).","<code>idempotency_key UNIQUE</code> turns a client retry into a harmless duplicate-key error."],
check:["Double-entry entries (each transaction sums to zero)","Append-only history; refunds are new rows","Unique idempotency key","Integer money in the smallest unit","Balance updated in the same DB transaction as the entries"]},

CREATE TABLE order_items (
  order_id BIGINT REFERENCES orders(id), sku_id BIGINT REFERENCES skus(id),

-- Reserve at checkout (fails if not enough free stock):
UPDATE inventory SET reserved = reserved + $qty
 WHERE sku_id=$sku AND warehouse_id=$wh AND on_hand - reserved &gt;= $qty;</code></pre>`,
why:["You sell <b>SKUs</b>, not products: \"blue T-shirt, size M\" is the thing with a price and stock.","<b>CHECK constraints</b> make the database refuse negative stock even if the app has a bug.","Checkout <b>reserves</b> stock with a conditional update; payment success turns the reservation into a real decrement, and a timeout job releases expired reservations.","Order items copy the unit price, like any order snapshot."],
check:["Products and SKUs (variants) as separate tables","Inventory keyed by SKU and warehouse","A reservation step or conditional update that can't oversell","CHECK constraint or equivalent guarding stock ≥ 0","Order items with a price snapshot"]},

/* SQL engine (lazy) */
let dbP=null;
function loadSQL(){
  if(dbP)return dbP;
  dbP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js";s.onload=()=>window.initSqlJs({locateFile:f=>"https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/"+f}).then(res,rej);s.onerror=()=>rej(new Error("Couldn't load the SQL engine. Check your internet connection."));document.head.appendChild(s);});
  dbP.catch(()=>{dbP=null;});
  return dbP;
}
function freshDB(SQL){const db=new SQL.Database();db.run(SQL_SEED);return db;}
function run(db,sql){const out=db.exec(sql);return out.length?out[out.length-1]:{columns:[],values:[]};}
const norm=v=>v===null?"NULL":typeof v==="number"?(Math.round(v*100)/100).toString():String(v);
function same(a,b,ordered){
  if(a.columns.length!==b.columns.length||a.values.length!==b.values.length)return false;
  const A=a.values.map(r=>r.map(norm).join("\u0001")),B=b.values.map(r=>r.map(norm).join("\u0001"));
  if(ordered)return A.every((r,i)=>r===B[i]);
  return A.slice().sort().join("\n")===B.slice().sort().join("\n");
}
function table(r){if(!r.columns.length)return `<p class="small muted">Query ran. No rows returned.</p>`;return `<div class="tscroll"><table class="tbl"><tr>${r.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${r.values.slice(0,50).map(row=>`<tr>${row.map(v=>`<td>${v===null?'<span class="muted">NULL</span>':esc(v)}</td>`).join("")}</tr>`).join("")}</table></div>${r.values.length>50?`<p class="small muted">Showing 50 of ${r.values.length} rows.</p>`:""}`;}

V.sql_x=function(el,id){

  <div class="tabs">${set.qs.map((x,j)=>`<button data-j="${j}" class="${j===i?"on":""}">${st().sql[x.id]?"✓ ":""}Q${j+1}</button>`).join("")}</div>
  <div class="grid g2" style="align-items:start"><div>
    <div class="card"><div class="eyebrow">Question ${i+1}</div><p style="font-size:1.05rem;margin:6px 0 10px">${q.q}</p>
    <textarea id="sqlin" class="code" spellcheck="false" placeholder="SELECT ... FROM ...">${esc(st().sql[draftKey]||"")}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="runq">Run ▶</button><button class="btn gold" id="chk">Check answer</button><button class="btn ghost sm" id="hint">Hint</button><button class="btn ghost sm" id="showsol">Show solution</button><span class="small muted">Ctrl+Enter runs</span></div>
    <div id="hintbox" class="small muted hidden" style="margin-top:8px">${esc(q.hint)}</div></div>

  <div class="card"><h3>Tables</h3><div id="schemaBox" class="small muted">Loading the database…</div></div></div>`;
  $$(".tabs button",el).forEach(b=>b.onclick=()=>{V.sql_x.i=+b.dataset.j;window.SQ.render();});
  const ta=$("#sqlin"),out=$("#sqlout");
  ta.oninput=()=>{st().sql[draftKey]=ta.value;window.SQ.save();};
  ta.onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();$("#runq").click();}};

  let SQLlib=null;
  loadSQL().then(L=>{SQLlib=L;const db=freshDB(L);const t=run(db,"SELECT name, sql FROM sqlite_master WHERE type='table'");
    $("#schemaBox").innerHTML=t.values.map(([n,sql])=>`<div style="margin-bottom:8px"><b class="mono">${esc(n)}</b><div class="mono">${esc(sql.replace(/^CREATE TABLE \w+ \(|\)$/g,""))}</div></div>`).join("")+`<p>Dates are text like <code>2026-11-03 21:15</code>; use <code>DATE(created_at)</code> for the day. <code>amount</code> and prices are in rupees.</p>`;
    db.close();}).catch(e=>{$("#schemaBox").textContent=e.message;});
  const exec=()=>{if(!SQLlib){out.innerHTML=`<p class="small muted">The SQL engine is still loading…</p>`;return null;}const db=freshDB(SQLlib);try{return {db,res:run(db,ta.value)};}catch(e){db.close();out.innerHTML=`<p style="color:var(--bad)"><b>Error:</b> ${esc(e.message)}</p>`;return null;}};

      const nb=$("#nextq");if(nb)nb.onclick=()=>{V.sql_x.i=i+1;window.SQ.render();};
      $$(".tabs button",el)[i].textContent="✓ Q"+(i+1);}
    else out.innerHTML=`<p style="color:var(--bad)"><b>Not quite.</b> Expected ${exp.values.length} row${exp.values.length===1?"":"s"} × ${exp.columns.length} column${exp.columns.length===1?"":"s"}; you returned ${r.res.values.length} × ${r.res.columns.length}.${q.ordered?" Order matters for this one.":""}</p>${table(r.res)}`;};
};

solution:`class TokenBucket:
    def __init__(self, capacity, refill_per_sec, clock):
        self.capacity = capacity
        self.rate = refill_per_sec
        self.clock = clock
        self.tokens = float(capacity)
        self.last = clock()

    def allow(self) -> bool:
        now = self.clock()
        self.tokens = min(self.capacity, self.tokens + (now - self.last) * self.rate)
        self.last = now
        if self.tokens >= 1:
            self.tokens -= 1
            return True
        return False
`},

solution:`SIZES = ["small", "medium", "large"]

class ParkingLot:
    def __init__(self, spots: dict):
        self.spots = {}                      # spot_id -> vehicle_id or None
        for size in SIZES:
            for i in range(1, spots.get(size, 0) + 1):
                self.spots[f"{size}-{i}"] = None
        self.where = {}                      # vehicle_id -> spot_id

    def park(self, vehicle_id: str, size: str):
        if vehicle_id in self.where:
            return None
        for s in SIZES[SIZES.index(size):]:
            for spot, v in self.spots.items():
                if spot.startswith(s + "-") and v is None:
                    self.spots[spot] = vehicle_id
                    self.where[vehicle_id] = spot
                    return spot
        return None

    def leave(self, vehicle_id: str) -> bool:
        spot = self.where.pop(vehicle_id, None)
        if spot is None:
            return False
        self.spots[spot] = None
        return True

    def available(self, size: str) -> int:
        return sum(1 for s, v in self.spots.items() if s.startswith(size + "-") and v is None)
`},

solution:`class VendingMachine:
    def __init__(self, items: dict):
        self.items = dict(items)
        self.balance = 0

    @property
    def state(self) -> str:
        return "has_money" if self.balance > 0 else "idle"

    def insert(self, amount: int) -> None:
        if amount <= 0:
            raise ValueError("amount must be positive")
        self.balance += amount

    def select(self, code: str) -> int:
        if self.balance == 0:
            raise ValueError("insert money first")
        if code not in self.items:
            raise ValueError("unknown item")
        price, count = self.items[code]
        if count == 0:
            raise ValueError("sold out")
        if self.balance < price:
            raise ValueError("insufficient funds")
        self.items[code] = (price, count - 1)
        change, self.balance = self.balance - price, 0
        return change

    def cancel(self) -> int:
        refund, self.balance = self.balance, 0
        return refund
`},

solution:`class Splitwise:
    def __init__(self):
        self.net = {}

    def add_expense(self, paid_by: str, amount: float, among: list) -> None:
        share = amount / len(among)
        self.net[paid_by] = self.net.get(paid_by, 0) + amount
        for p in among:
            self.net[p] = self.net.get(p, 0) - share

    def balances(self) -> dict:
        return {p: round(v, 2) for p, v in self.net.items()}

    def settle(self) -> list:
        bal = {p: round(v, 2) for p, v in self.net.items()}
        pays = []
        while True:
            debtor = min(bal, key=bal.get)
            creditor = max(bal, key=bal.get)
            if bal[creditor] < 0.01:
                return pays
            amt = round(min(-bal[debtor], bal[creditor]), 2)
            if amt <= 0:
                return pays
            pays.append((debtor, creditor, amt))
            bal[debtor] += amt
            bal[creditor] -= amt

hints:["Keep a dict topic -> list of handlers; skip adding a handler that's already in the list.","In publish, wrap each call in try/except Exception as e, append (topic, str(e)) to errors, and count successes."],
solution:`class EventBus:
    def __init__(self):
        self.errors = []
        self.subs = {}

    def subscribe(self, topic: str, handler):
        handlers = self.subs.setdefault(topic, [])
        if handler not in handlers:
            handlers.append(handler)
        def unsubscribe():
            if handler in handlers:
                handlers.remove(handler)
        return unsubscribe

    def publish(self, topic: str, payload) -> int:
        ok = 0
        for h in list(self.subs.get(topic, [])):
            try:
                h(payload)
                ok += 1
            except Exception as e:
                self.errors.append((topic, str(e)))
        return ok

  if(cur&&scrolled!==window.SQ.today()&&doneN>0){scrolled=window.SQ.today();setTimeout(()=>{const n=$(`[data-k="${cur.key}"]`,el);if(n)n.scrollIntoView({block:"center",behavior:"smooth"});},60);}
};

function stageHTML(s,cur,pi,phi){
  const dn=s.levels.filter(isDone).length,all=dn===s.levels.length;const chest=S().chests[s.n];
  const sc=`var(--w${phi+1})`;
  let k=0;
  return `<section class="stage" style="--sc:${sc}"><div class="stage-head"><span class="sn">${s.n}</span><div><div class="eyebrow">Stage ${s.n} · Week ${s.n}</div><h2>${esc(s.title)}</h2><p>${esc(s.goal)}</p></div><div class="sp"><b>${dn}/${s.levels.length}</b><div class="bar"><i style="width:${dn/s.levels.length*100}%;background:${sc}"></i></div></div></div>
  <div class="trailmap">${s.levels.map(lv=>{const d=isDone(lv),c=cur&&cur.key===lv.key,o=openKey===lv.key;const t=lv.topic&&TOPICS.find(x=>x.id===lv.topic);const wc=t?WORLDS.find(w=>w.n===t.w).c:sc;const x=ZIG[(k++)%ZIG.length];
    return `<div class="lvrow" style="--x:${x}"><button class="lv ${lv.type} ${d?"done":""} ${c?"cur":""} ${o?"open":""}" data-k="${lv.key}" style="--lc:${wc}" aria-expanded="${o}" aria-label="${KIND[lv.type]}: ${esc(lv.title)}${d?" (done)":""}">${c?`<span class="here">${isDone(LEVELS[0])||LEVELS.indexOf(lv)?"You are here":"Start here"}</span>`:""}<i><svg viewBox="0 0 24 24">${d?ICON.done:ICON[lv.type]}</svg></i></button><div class="lvl-lab"><b>${esc(lv.title)}</b><span>${KIND[lv.type]}${lv.day!=null?` · Day ${lv.day%7+1}`:""}${lv.day===pi?' · <em>Today</em>':""}</span></div></div>${o?detailHTML(lv,d,wc):""}`;}).join("")}
  <div class="lvrow" style="--x:0"><button class="chest ${all?(chest?"opened":"ready"):""}" data-chest="${s.n}" ${all&&!chest?"":"disabled"} aria-label="Stage ${s.n} chest">${chestSvg(all&&chest)}</button><div class="lvl-lab"><b>${chest?"Chest opened":all?"Open your chest! +100 XP":"Stage chest"}</b><span>${chest?"Opened "+chest:all?"Stage complete":`${s.levels.length-dn} level${s.levels.length-dn===1?"":"s"} to go`}</span></div></div></div></section>`;
}
function chestSvg(open){return `<svg viewBox="0 0 48 40" aria-hidden="true"><rect x="5" y="${open?17:15}" width="38" height="21" rx="3" style="fill:var(--xp)"/><path d="${open?"M5 15 L9 3 H39 L43 15Z":"M5 16 Q5 4 24 4 Q43 4 43 16Z"}" style="fill:color-mix(in srgb,var(--xp) 75%,#000)"/><rect x="20" y="${open?20:13}" width="8" height="9" rx="2" style="fill:#fff8dc"/></svg>`;}

function detailHTML(lv,d,wc){
  const t=lv.topic&&TOPICS.find(x=>x.id===lv.topic);const p=lv.prob&&PROBLEMS.find(x=>x.id===lv.prob);
  const date=lv.day!=null?fmt(window.SQ.addDays(window.SQ.PLAN_START,lv.day)):"";
  let main="",rule="";
  if(lv.type==="lesson"||lv.type==="side"){main=`<a class="btn primary" href="#topic-${t.id}">${S().topics[t.id]?"Revisit lesson":"Play lesson"}</a>`;rule=S().topics[t.id]?"Lesson cleared.":"Clear it by finishing the lesson's quiz (+50 XP). It then joins your review queue.";}
  else if(lv.type==="boss"||lv.type==="bonus"){main=`<a class="btn primary" href="#problem-${p.id}">${attempted(p.id)?"Fight again":"Fight the boss"}</a>`;rule=attempted(p.id)?`Beaten. Best score ${S().prob[p.id].best}/16.`:"Beat it by submitting one graded attempt (+100 XP + rubric).";}
  else if(lv.type==="lab"){main=`<a class="btn primary" href="${lv.href}"${lv.kata?` data-kata-go="${lv.kata}"`:""}>Open the lab</a>`;rule=isDone(lv)?"Lab complete.":lv.lab.startsWith("k:")?"Make every test pass (+60 XP).":lv.lab.startsWith("s:")?"Draft the tables, compare with the model answer, and mark it solved (+40 XP).":"Solve every query in the set (+20 XP each).";}
  else if(lv.type==="practice"){main=`<a class="btn primary" href="#${lv.route}">Open ${ROUTE_NAME[lv.route]||lv.route}</a>`;rule="Do the practice, then mark the level complete.";}
  else if(t||p){main=`<a class="btn" href="${t?"#topic-"+t.id:"#problem-"+p.id}">Open ${esc(t?t.title:p.title)}</a>`;rule="Do the task, then mark the level complete.";}
  else rule="Do the task, then mark the level complete.";
  const tick=lv.day!=null&&!(d&&!S().plan[lv.day])?`<button class="btn ${S().plan[lv.day]?"":"gold"}" data-tick="${lv.day}">${S().plan[lv.day]?"Completed ✓ (undo)":"Mark complete +30 XP"}</button>`:"";
  return `<div class="lvcard" style="--lc:${wc}"><div class="row" style="gap:6px"><span class="tag" style="background:var(--lc);color:#fff">${KIND[lv.type]}</span>${t?`<span class="tag">World ${t.w} · ${esc(WORLDS.find(w=>w.n===t.w).name)}</span><span class="tag">${t.mins} min</span>`:""}${p?`<span class="tag ${p.diff.toLowerCase()}">${p.diff}</span>`:""}${date?`<span class="tag">${date}</span>`:""}</div>
  <h3>${esc(lv.title)}</h3>${lv.task&&lv.task!==lv.title?`<div class="small muted" style="margin-top:-4px">Plan task: ${esc(lv.task)}</div>`:""}
  <p>${esc(lv.desc||"")}</p>${lv.u?`<p class="small"><a href="${lv.u}" target="_blank" rel="noopener">${esc(lv.s||"Resource")} ↗</a></p>`:""}
  <p class="small muted">${rule}</p><div class="row">${main}${tick}</div></div>`;
}

function wire(el){
  $$(".lv",el).forEach(b=>b.onclick=()=>{openKey=openKey===b.dataset.k?"":b.dataset.k;const y=b.getBoundingClientRect().top;window.SQ.render();const nb=$(`[data-k="${b.dataset.k}"]`);if(nb)window.scrollBy(0,nb.getBoundingClientRect().top-y);});
  $$("[data-tick]",el).forEach(b=>b.onclick=()=>{const i=+b.dataset.tick;const y=b.getBoundingClientRect().top;const was=!!S().plan[i];window.SQ.togglePlan(i);
    if(!was){const lv=LEVELS.find(l=>l.day===i);const nx=LEVELS[LEVELS.indexOf(lv)+1];if(nx&&!isDone(nx))openKey=nx.key;}
    window.SQ.render();const k=openKey&&$(`[data-k="${openKey}"]`);if(k&&!was)k.scrollIntoView({block:"center",behavior:"smooth"});else window.scrollBy(0,0*y);});
  $$("[data-chest]",el).forEach(b=>b.onclick=()=>{const n=+b.dataset.chest;if(S().chests[n])return;S().chests[n]=window.SQ.today();window.SQ.addXP(100,`Stage ${n} chest`);window.SQ.confetti(120);window.SQ.modal(`<div class="eyebrow">Stage ${n} complete</div><h2>Chest opened: +100 XP</h2><p>${esc(STAGES[n-1].title)} is done. ${n<STAGES.length?`Stage ${n+1}: <b>${esc(STAGES[n].title)}</b> is next.`:"That was the final stage. You're interview-ready: keep the review queue and mocks going."}</p>`);window.SQ.render();});
  $$("[data-kata-go]",el).forEach(a=>a.onclick=()=>{V.lld.tab="code";V.lld.kata=a.dataset.kataGo;});
  const gc=$("#goCur",el);if(gc)gc.onclick=()=>{const c=LEVELS.find(l=>!isDone(l));openKey=c.key;window.SQ.render();const n=$(`[data-k="${c.key}"]`);if(n)n.scrollIntoView({block:"center",behavior:"smooth"});};
  const gt=$("#goToday",el);if(gt)gt.onclick=()=>{const l=LEVELS.find(x=>x.day===window.SQ.planIndex());openKey=l.key;window.SQ.render();const n=$(`[data-k="${l.key}"]`);if(n)n.scrollIntoView({block:"center",behavior:"smooth"});};
}
