<title>Scale Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: quest console. Sidebar HUD on desktop, bottom tab bar on phones; each "world" owns a hue. */
:root{
  --bg:#f5f4fa; --panel:#ffffff; --panel-2:#efedf7; --ink:#1c1a2e; --muted:#5f5b78; --faint:#9a96b3;
  --line:#e2dfee; --line-2:#cfcae2;
  --accent:#0f8f85; --accent-ink:#0a6b63; --accent-soft:#dff4f1;
  --xp:#e3a008; --xp-soft:#fdf3d4; --flame:#f2542d; --flame-soft:#fde5dd;
  --good:#1a8f4c; --good-soft:#ddf3e6; --bad:#cc3344; --bad-soft:#fbe1e4;
  --w1:#0f8f85; --w2:#2f6fdb; --w3:#c2410c; --w4:#7c3aed; --w5:#b5179e; --w6:#0e7490; --w7:#a16207; --w8:#db2777;
  --n-client:#e8f0fe; --n-client-s:#5b8def; --n-edge:#e6f6f3; --n-edge-s:#0f8f85; --n-svc:#fff3e0; --n-svc-s:#e08a1e;
  --n-db:#efe7fd; --n-db-s:#7c3aed; --n-cache:#fde7ef; --n-cache-s:#db2777; --n-queue:#fff8d6; --n-queue-s:#b58a00;
  --n-ext:#e6f4fb; --n-ext-s:#0e7490;
  --shadow:0 1px 2px rgba(28,26,46,.05),0 4px 16px rgba(28,26,46,.06);
  --r:14px; --r-sm:9px;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13121c; --panel:#1c1b28; --panel-2:#252334; --ink:#f0eef8; --muted:#aba6c6; --faint:#77728f;
  --line:#2f2d40; --line-2:#3f3c55;
  --accent:#3cc9bb; --accent-ink:#7fe0d6; --accent-soft:#163a37;
  --xp:#f5c24a; --xp-soft:#3a3018; --flame:#ff7a55; --flame-soft:#3d2219;
  --good:#4fd18a; --good-soft:#173826; --bad:#ff6b7a; --bad-soft:#3d1d23;
  --w1:#3cc9bb; --w2:#6f9cff; --w3:#ff8a4c; --w4:#a98bff; --w5:#f06fd6; --w6:#38bdd8; --w7:#e0b440; --w8:#ff6fa8;
  --n-client:#1e2a45; --n-client-s:#7aa3ff; --n-edge:#163532; --n-edge-s:#3cc9bb; --n-svc:#3a2a14; --n-svc-s:#f0a843;
  --n-db:#2b2147; --n-db-s:#a98bff; --n-cache:#3d1a2b; --n-cache-s:#ff6fa8; --n-queue:#36300f; --n-queue-s:#e8c547;
  --n-ext:#13323d; --n-ext-s:#38bdd8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13121c; --panel:#1c1b28; --panel-2:#252334; --ink:#f0eef8; --muted:#aba6c6; --faint:#77728f;
  --line:#2f2d40; --line-2:#3f3c55;
  --accent:#3cc9bb; --accent-ink:#7fe0d6; --accent-soft:#163a37;
  --xp:#f5c24a; --xp-soft:#3a3018; --flame:#ff7a55; --flame-soft:#3d2219;
  --good:#4fd18a; --good-soft:#173826; --bad:#ff6b7a; --bad-soft:#3d1d23;
  --w1:#3cc9bb; --w2:#6f9cff; --w3:#ff8a4c; --w4:#a98bff; --w5:#f06fd6; --w6:#38bdd8; --w7:#e0b440; --w8:#ff6fa8;
  --n-client:#1e2a45; --n-client-s:#7aa3ff; --n-edge:#163532; --n-edge-s:#3cc9bb; --n-svc:#3a2a14; --n-svc-s:#f0a843;
  --n-db:#2b2147; --n-db-s:#a98bff; --n-cache:#3d1a2b; --n-cache-s:#ff6fa8; --n-queue:#36300f; --n-queue-s:#e8c547;
  --n-ext:#13323d; --n-ext-s:#38bdd8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:var(--accent-ink);text-underline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0;letter-spacing:-.01em}
code,pre,kbd{font-family:var(--f-mono);font-size:.86em}
code{background:var(--panel-2);padding:1px 5px;border-radius:5px}
pre{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;overflow-x:auto;line-height:1.5;margin:10px 0}
pre code{background:none;padding:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding:18px 14px 24px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-top:-2px}
.hud{background:var(--panel-2);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lvl{display:flex;align-items:center;gap:10px}
.lvl-ring{width:44px;height:44px;flex:none}
.lvl b{font-family:var(--f-display);font-size:.98rem;display:block;line-height:1.15}
.lvl span{font-size:.75rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.flame{color:var(--flame);background:var(--flame-soft);border-color:transparent}
.chip.xp{color:var(--xp);background:var(--xp-soft);border-color:transparent}
.chip.ice{color:var(--w6)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--w2));border-radius:inherit;transition:width .5s ease}
.bar.gold>i{background:linear-gradient(90deg,var(--xp),var(--flame))}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.94rem}
.nav a:hover{background:var(--panel-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:0 6px}
.main{min-width:0;padding-block:22px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
.topbar{display:none}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:center;justify-content:space-between;gap:8px}
  .topbar .brand b{font-size:1.05rem}
  .topbar .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:700;color:var(--muted);text-decoration:none;padding:4px 0;border-radius:8px}
  .tabbar a.on{color:var(--accent-ink)}
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .main{padding-block:16px 96px}
}
/* generic blocks */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 18px}
.page-head h1{font-size:clamp(1.6rem,3.4vw,2.2rem);font-weight:800}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:650;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);transition:transform .08s ease,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root:not([data-theme="light"]) .btn.primary{color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.gold{background:var(--xp);border-color:var(--xp);color:#2a1d00}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.tag.easy{background:var(--good-soft);color:var(--good)}
.tag.medium{background:var(--xp-soft);color:var(--xp)}
.tag.hard{background:var(--bad-soft);color:var(--bad)}
.tag.co{background:var(--accent-soft);color:var(--accent-ink)}
.sect{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sect h2{font-size:1.25rem}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-main{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent-soft),var(--panel) 60%);}
.hero-main h1{font-size:clamp(1.5rem,3.2vw,2rem);font-weight:800;margin:4px 0 6px}
.goal{display:flex;gap:16px;align-items:center;margin-top:14px;flex-wrap:wrap}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1}
.ring .lbl small{display:block;font-family:var(--f-body);font-size:.66rem;font-weight:600;color:var(--muted);margin-top:3px}
.streak-big{display:flex;align-items:center;gap:12px}
.streak-big .num{font-family:var(--f-display);font-size:2.6rem;font-weight:800;color:var(--flame);line-height:1}
.week-dots{display:flex;gap:6px;margin-top:10px}
.week-dots span{width:30px;text-align:center;font-size:.68rem;color:var(--muted)}
.week-dots i{display:block;width:26px;height:26px;margin:0 auto 3px;border-radius:50%;border:2px solid var(--line-2)}
.week-dots i.on{background:var(--flame);border-color:var(--flame)}
.week-dots i.frz{background:var(--n-ext);border-color:var(--w6)}
.week-dots i.today{box-shadow:0 0 0 3px var(--flame-soft)}
.quest{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.quest:first-of-type{border-top:0}
.quest .qi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel-2);font-weight:800;font-family:var(--f-display)}
.quest.done .qi{background:var(--good-soft);color:var(--good)}
.quest b{font-size:.92rem;display:block}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 60%,var(--line))}
.heat i.l3{background:var(--accent)}
.heat i.l4{background:var(--accent-ink)}
.heat i.fz{background:var(--w6);opacity:.5}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted);font-weight:600}
/* path map */
.world{margin:22px 0 30px}
.world-head{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--wc) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--wc) 30%,var(--line))}
.world-head .wn{width:46px;height:46px;border-radius:13px;background:var(--wc);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.25rem;flex:none}
.world-head h2{font-size:1.15rem}
.world-head p{margin:0;color:var(--muted);font-size:.88rem}
.world-head .wp{margin-left:auto;min-width:90px;text-align:right;font-size:.8rem;font-weight:700;color:var(--muted)}
.trail{position:relative;display:grid;gap:4px;padding:14px 0 0}
.node{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);width:max-content;max-width:100%;padding:6px 10px 6px 6px;border-radius:99px}
.node:hover{background:var(--panel)}
.node .dot{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--panel);border:3px solid color-mix(in srgb,var(--wc) 45%,var(--line));color:var(--wc);box-shadow:0 4px 0 color-mix(in srgb,var(--wc) 25%,var(--line));transition:transform .15s}
.node:hover .dot{transform:translateY(-2px)}
.node.done .dot{background:var(--wc);color:#fff;border-color:var(--wc)}
.node.next .dot{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 color-mix(in srgb,var(--wc) 25%,var(--line)),0 0 0 0 color-mix(in srgb,var(--wc) 40%,transparent)}50%{box-shadow:0 4px 0 color-mix(in srgb,var(--wc) 25%,var(--line)),0 0 0 9px transparent}}
.node .nt b{display:block;font-size:.95rem;line-height:1.25}
.node .nt span{font-size:.78rem;color:var(--muted)}
.trail .node:nth-child(4n+2){margin-left:min(14%,90px)}
.trail .node:nth-child(4n+3){margin-left:min(26%,170px)}
.trail .node:nth-child(4n+4){margin-left:min(14%,90px)}
/* topic */
.topic-hero{border-radius:var(--r);padding:20px;background:color-mix(in srgb,var(--wc) 11%,var(--panel));border:1px solid color-mix(in srgb,var(--wc) 28%,var(--line));margin-bottom:16px}
.topic-hero h1{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:800;margin:6px 0 8px}
.tldr{font-size:1.04rem;max-width:70ch;margin:0}
.notes{max-width:76ch}
.notes h3{font-size:1.08rem;margin:20px 0 6px;color:var(--wc,var(--ink))}
.notes p{margin:6px 0}
.notes ul,.notes ol{padding-left:1.2rem;margin:6px 0}
.notes li{margin:3px 0}
.notes table,.tbl{border-collapse:collapse;width:100%;font-size:.9rem;margin:8px 0}
.notes th,.notes td,.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.notes th,.tbl th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tscroll{overflow-x:auto}
.callout{border-radius:var(--r-sm);padding:12px 14px;margin:12px 0;border:1px solid var(--line);background:var(--panel)}
.callout .ct{font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.callout.real{background:var(--n-ext);border-color:transparent}.callout.real .ct{color:var(--w6)}
.callout.trap{background:var(--bad-soft);border-color:transparent}.callout.trap .ct{color:var(--bad)}
.callout.say{background:var(--good-soft);border-color:transparent}.callout.say .ct{color:var(--good)}
.callout ul{margin:4px 0;padding-left:1.1rem}
.diagram{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin:12px 0}
.diagram svg{display:block;min-width:560px;width:100%;height:auto}
.diagram .cap{font-size:.8rem;color:var(--muted);padding:4px 6px 0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.74rem;color:var(--muted);padding:6px 6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* quiz */
.q{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0;background:var(--panel)}
.q .qt{font-weight:650;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1.5px solid var(--line-2);background:var(--panel);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:.93rem}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.why{margin-top:8px;font-size:.88rem;color:var(--muted)}
.combo{font-family:var(--f-display);font-weight:800;color:var(--flame)}
/* arena */
.pcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);transition:transform .12s,border-color .12s}
.pcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.pcard h3{font-size:1.05rem}
.pcard p{margin:0;font-size:.88rem;color:var(--muted)}
.stars{color:var(--xp);letter-spacing:2px;font-size:.9rem}
.stars .off{color:var(--line-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.step{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0;background:var(--panel)}
.step label{font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.step label span{font-weight:500;font-size:.8rem;color:var(--muted)}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;margin-top:6px}
textarea{min-height:86px;resize:vertical;font-family:var(--f-mono);font-size:.84rem;line-height:1.5}
.timer{font-family:var(--f-mono);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}

T({id:"what-is-sd",w:1,title:"What system design is",mins:10,
tldr:"System design is deciding <b>which components</b> a product needs, <b>how they talk</b>, and <b>which trade-offs</b> you accept so it keeps working as users, data and failures grow.",
notes:`<h3>HLD vs LLD</h3>
<table><tr><th></th><th>High-level design (HLD)</th><th>Low-level design (LLD)</th></tr>
<tr><td>Question</td><td>"Design WhatsApp"</td><td>"Design a parking lot's classes"</td></tr>
<tr><td>Output</td><td>Boxes and arrows: services, DBs, caches, queues</td><td>Classes, interfaces, methods, working code</td></tr>
<tr><td>Judged on</td><td>Scale, availability, trade-offs</td><td>OOP, SOLID, patterns, extensibility</td></tr></table>
<h3>What freshers are actually asked</h3>
<ul><li>Fresher / SDE-1 rounds lean on <b>fundamentals + one classic problem</b> (URL shortener, rate limiter, chat, parking lot LLD). Nobody expects Netflix-level depth.</li>
<li>They want to see you <b>ask questions</b>, <b>structure</b> the answer, and <b>justify</b> choices with a reason, not a buzzword.</li></ul>
<h3>The four things every design is judged on</h3>
<ol><li><b>Scalability</b>: handles more load by adding resources.</li><li><b>Availability</b>: up when users need it.</li><li><b>Performance</b>: latency and throughput are good enough.</li><li><b>Consistency / correctness</b>: users see right data (money must never be wrong).</li></ol>
<p>Every component you add should push one of these, and costs something (money, complexity, staleness).</p>`,
real:`Instagram ran on a handful of servers and Postgres when it had a tiny team; it added sharding, caching and async jobs only when load forced it. Start simple, then scale the part that hurts.`,
say:["\"Before I draw anything, can I confirm the core features and the scale we're designing for?\"","\"I'll start with a simple version that works, then scale the bottlenecks.\""],
traps:["Jumping into Kafka and microservices before stating requirements.","Saying \"it's scalable\" without saying <i>which</i> part scales and how."],
src:[["Hello Interview: intro","https://www.hellointerview.com/learn/system-design/in-a-hurry/introduction"],["AlgoMaster: what is system design","https://algomaster.io/learn/system-design/what-is-system-design"],["GfG: getting started","https://www.geeksforgeeks.org/system-design/getting-started-with-system-design"]],
quiz:[
{q:"Which question is a low-level design (LLD) question?",o:["Design YouTube","Design the classes for a parking lot","Design a CDN","Design a news feed for 500M users"],a:1,why:"LLD is about classes, interfaces and code. The others are high-level architecture."},
{q:"What should you do in the first 5 minutes of a design interview?",o:["Draw the database schema","Pick Kafka vs RabbitMQ","Clarify functional and non-functional requirements","Write the API in code"],a:2,why:"Requirements drive every later choice. Interviewers grade you on asking."},
{q:"A design adds a cache. Which property is it mainly buying, and what does it usually cost?",o:["Consistency; costs latency","Lower latency; risks stale reads","Availability; costs storage only","Security; costs CPU"],a:1,why:"Caches cut latency and DB load but can serve stale data until invalidated or expired."}]});

T({id:"scalability",w:1,title:"Scalability: vertical vs horizontal",mins:12,
tldr:"<b>Vertical</b> = a bigger machine. <b>Horizontal</b> = more machines behind a load balancer. Horizontal only works if app servers are <b>stateless</b>.",
notes:`<table><tr><th></th><th>Vertical (scale up)</th><th>Horizontal (scale out)</th></tr>
<tr><td>How</td><td>More CPU/RAM on one box</td><td>Add boxes + load balancer</td></tr>
<tr><td>Pros</td><td>Simple, no code changes, no network hops</td><td>Near-unlimited, survives a box dying</td></tr>
<tr><td>Cons</td><td>Hardware ceiling, single point of failure, downtime to upgrade</td><td>Needs stateless apps, distributed problems (consistency, coordination)</td></tr></table>
<h3>Stateless services</h3>
<p>A server is stateless when any instance can handle any request. Move session data, uploads and counters <b>out</b> of process memory into Redis, a DB or object storage. Then the load balancer can send a user to any box, and you can add or kill boxes freely.</p>
<h3>Scaling roadmap (single box → millions)</h3>
<ol><li>One server running app + DB.</li><li>Split DB onto its own machine.</li><li>Load balancer + several stateless app servers.</li><li>Cache (Redis) for hot reads; CDN for static files.</li><li>DB read replicas; later sharding.</li><li>Queues for slow work; split services where teams or load differ.</li><li>Multiple data centres / regions.</li></ol>`,
diagram:{w:760,h:250,n:[["u",70,125,"Users","web + mobile","client"],["lb",230,125,"Load balancer","L7","edge"],["a1",400,55,"App server 1","stateless","svc"],["a2",400,125,"App server 2","stateless","svc"],["a3",400,195,"App server 3","stateless","svc"],["r",600,60,"Redis","sessions + cache","cache"],["db",600,190,"Postgres","primary","db"]],e:[["u","lb"],["lb","a1"],["lb","a2"],["lb","a3"],["a2","r"],["a2","db"],["a1","r","",1],["a3","db","",1]]},dcap:"Horizontal scale: state lives in Redis/Postgres, so any app server can serve any user.",
real:`Most startups scale Postgres vertically for a long time (a single large instance goes far). Stateless app tiers are standard on Kubernetes: pods are added by an autoscaler based on CPU or request rate.`,
say:["\"I'll keep the API tier stateless so we can autoscale it; sessions go to Redis.\"","\"The database is the harder thing to scale, so I'll add read replicas before thinking about sharding.\""],
traps:["Sticky sessions are a band-aid, not statelessness: if that box dies, the user's session dies.","Horizontal scaling of the <i>database</i> is much harder than the app tier. Don't wave it away."],
quiz:[
{q:"What must be true of app servers before you can freely add more behind a load balancer?",o:["They run on bigger machines","They're stateless (no per-user data kept in memory)","They each have their own database","They use UDP"],a:1,why:"If state is in process memory, a user's next request might hit a server that doesn't have it."},
{q:"Biggest downside of vertical scaling?",o:["Needs code changes","Hardware ceiling and a single point of failure","Requires a load balancer","Makes queries slower"],a:1,why:"One machine can only get so big, and if it dies, everything dies."},
{q:"Where should user sessions live in a horizontally scaled web app?",o:["In each server's memory","In a shared store like Redis","In cookies only, always","In the load balancer"],a:1,why:"A shared store lets any server read the session. Signed cookies/JWT are another stateless option but have revocation trade-offs."}]});

T({id:"availability",w:1,title:"Availability, reliability and SPOFs",mins:12,
tldr:"Availability = uptime ÷ total time, quoted in <b>nines</b>. You raise it by removing <b>single points of failure</b> with redundancy and failover.",
notes:`<h3>The nines</h3>
<table><tr><th>Availability</th><th>Downtime / year</th><th>Downtime / month</th></tr>
<tr><td>99% (two nines)</td><td>3.65 days</td><td>~7.3 hours</td></tr>
<tr><td>99.9%</td><td>8.76 hours</td><td>~43.8 min</td></tr>
<tr><td>99.99%</td><td>52.6 min</td><td>~4.4 min</td></tr>
<tr><td>99.999%</td><td>5.26 min</td><td>~26 s</td></tr></table>
<h3>Components in series vs parallel</h3>
<ul><li><b>Series</b> (request needs A <i>and</i> B): A × B. Two 99.9% parts → 99.8%. Every extra hop lowers availability.</li>
<li><b>Parallel</b> (either A <i>or</i> B works): 1 − (1−A)(1−B). Two 99% replicas → 99.99%.</li></ul>
<h3>Reliability vs availability</h3>
<p><b>Reliable</b> = does the right thing (correct, no data loss). <b>Available</b> = responds. A system can be available but unreliable (returns wrong data fast).</p>
<h3>Removing SPOFs</h3>
<ul><li>Run ≥2 of everything: LBs (active-passive with a floating IP), app servers, DB replicas with automatic failover.</li>
<li>Spread across availability zones; health checks pull dead nodes out.</li>
<li><b>SLI</b> = what you measure (p99 latency, error rate). <b>SLO</b> = your target (99.9% of requests &lt; 300 ms). <b>SLA</b> = the contract with penalties.</li></ul>`,
real:`AWS states its EC2 SLA per region; real systems put replicas in multiple availability zones so one data-centre fire doesn't take them down.`,
say:["\"Each extra synchronous dependency multiplies in, so I'll keep the critical path short.\"","\"I'll put the DB primary and replica in different zones with automatic failover.\""],
traps:["Adding a single load balancer can itself be a SPOF; say how it's made redundant.","Confusing SLA (contract) with SLO (internal target)."],
quiz:[
{q:"Two services in series, each 99.9% available. Approximate combined availability?",o:["99.9%","99.99%","99.8%","99.0%"],a:2,why:"0.999 × 0.999 ≈ 0.998. Serial dependencies multiply."},
{q:"99.99% availability allows roughly how much downtime per year?",o:["8.8 hours","52.6 minutes","5.3 minutes","3.65 days"],a:1,why:"0.01% of 525,600 minutes ≈ 52.6 minutes."},
{q:"Two independent replicas, each 99% available, behind a failover. Combined?",o:["98%","99%","99.99%","99.5%"],a:2,why:"1 − (0.01 × 0.01) = 0.9999."}]});

T({id:"latency",w:1,title:"Latency, throughput and numbers to know",mins:12,
tldr:"<b>Latency</b> is how long one request takes; <b>throughput</b> is how many you finish per second. Know a few orders of magnitude so you can reason about where time goes.",
notes:`<h3>Percentiles, not averages</h3>
<p>Report <b>p50 / p95 / p99</b>. If p99 is 2 s, 1 in 100 requests is slow; a page that makes 50 backend calls hits that tail often.</p>
<h3>Latency numbers (rough, from Jeff Dean's list)</h3>
<table><tr><th>Operation</th><th>Time</th></tr>
<tr><td>L1 cache reference</td><td>0.5 ns</td></tr><tr><td>Main memory reference</td><td>100 ns</td></tr>
<tr><td>Read 1 MB sequentially from memory</td><td>250 µs</td></tr><tr><td>Round trip in the same data centre</td><td>0.5 ms</td></tr>
<tr><td>Read 1 MB sequentially from SSD</td><td>1 ms</td></tr><tr><td>Disk seek (HDD)</td><td>10 ms</td></tr>
<tr><td>Packet California → Netherlands → California</td><td>150 ms</td></tr></table>
<p>Takeaways: memory ≫ SSD ≫ network across continents. Avoid cross-region calls on the hot path; batch small calls.</p>
<h3>Capacity rules of thumb</h3>
<ul><li>Redis: ~100k simple ops/s per node. Postgres/MySQL: thousands to ~10k simple writes/s on a good node.</li>
<li>Little's Law: concurrent requests = throughput × latency. 1,000 req/s × 0.2 s = 200 in flight.</li></ul>`,
real:`Amazon found that small increases in page latency measurably cut sales, which is why big sites track p99 and set latency budgets per service.`,
say:["\"I'll design for p99 under 200 ms, so the read path should avoid more than one DB round trip.\""],
traps:["Quoting averages. Interviewers expect percentiles.","Assuming throughput and latency always move together: batching raises throughput but can raise latency."],
src:[["Latency numbers (gist)","https://gist.github.com/jboner/2841832"]],
quiz:[
{q:"Which is fastest?",o:["Read 1 MB from SSD","Round trip within a data centre","Main memory reference","Disk seek"],a:2,why:"~100 ns, far faster than the others (0.5 ms, 1 ms, 10 ms)."},
{q:"Why use p99 instead of average latency?",o:["It's easier to compute","Averages hide slow tail requests that users still feel","p99 is always lower","SLAs forbid averages"],a:1,why:"A good average can hide a terrible tail."},
{q:"A service handles 500 req/s with 0.4 s average latency. Roughly how many requests are in flight (Little's Law)?",o:["125","200","1,250","2,000"],a:1,why:"L = λW = 500 × 0.4 = 200."}]});

T({id:"cap",w:1,title:"CAP and PACELC",mins:12,
tldr:"When the network <b>partitions</b>, a distributed store must pick <b>consistency</b> (refuse or wait) or <b>availability</b> (answer, maybe stale). PACELC adds: even without a partition, you trade <b>latency</b> vs consistency.",
notes:`<h3>The three letters</h3>
<ul><li><b>C</b>onsistency (here = linearizability): every read sees the latest write.</li><li><b>A</b>vailability: every request to a live node gets a non-error answer.</li><li><b>P</b>artition tolerance: keeps working when nodes can't talk.</li></ul>
<p>Partitions <i>will</i> happen, so the real choice is <b>CP vs AP during a partition</b>.</p>
<table><tr><th>Choice</th><th>Behaviour in a partition</th><th>Examples</th><th>Use for</th></tr>
<tr><td>CP</td><td>Rejects/blocks some requests to stay correct</td><td>ZooKeeper, etcd, HBase, a single-leader SQL DB</td><td>Payments, inventory, locks, seat booking</td></tr>
<tr><td>AP</td><td>Answers from any replica, reconciles later</td><td>Cassandra, DynamoDB (default reads), DNS</td><td>Feeds, likes, carts, presence</td></tr></table>
<h3>PACELC</h3><p>If <b>P</b>artition: choose <b>A</b> or <b>C</b>; <b>E</b>lse: choose <b>L</b>atency or <b>C</b>onsistency. E.g. DynamoDB/Cassandra are PA/EL; a synchronously replicated SQL DB is PC/EC.</p>
<h3>Consistency models (weak → strong)</h3>
<p>Eventual → read-your-writes → monotonic reads → causal → strong (linearizable). You can mix: strong for balance, eventual for like counts.</p>`,
real:`Cassandra lets you tune per query: with N=3 replicas, writing and reading at QUORUM (2 each) gives W + R > N, so reads overlap the latest write.`,
say:["\"Bookings need CP: I'd rather reject a request than sell the same seat twice. The feed can be AP.\""],
traps:["Saying \"we choose CA\". In a distributed system you can't opt out of partitions.","CAP's C is not ACID's C (ACID C means constraints hold)."],
quiz:[
{q:"During a network partition, a CP system will…",o:["Return possibly stale data","Reject or delay some requests to stay consistent","Lose partition tolerance","Become CA"],a:1,why:"CP gives up availability for some requests during the partition."},
{q:"Which feature fits eventual consistency best?",o:["Bank transfer","Seat booking","Like counter on a post","Distributed lock"],a:2,why:"A like count off by a few for a second harms nobody."},
{q:"N = 3 replicas. Which (W, R) guarantees a read overlaps the latest write?",o:["W=1, R=1","W=1, R=2","W=2, R=2","W=2, R=1"],a:2,why:"Need W + R > N: 2 + 2 = 4 > 3."}]});

T({id:"internet",w:2,title:"How a request travels: TCP, UDP, TLS, HTTP",mins:15,
tldr:"Typing a URL triggers <b>DNS → TCP handshake → TLS handshake → HTTP request</b>. HTTP/2 multiplexes on one connection; HTTP/3 runs on <b>QUIC over UDP</b>.",
notes:`<h3>What happens when you type a URL</h3>
<ol><li>Browser checks caches, then asks DNS for the IP.</li><li>TCP 3-way handshake: SYN → SYN-ACK → ACK (1 round trip).</li><li>TLS 1.3 handshake (1 round trip; 0-RTT on resumption) to agree keys and verify the certificate.</li><li>HTTP request → load balancer → app → DB/cache → response.</li><li>Browser parses HTML, fetches CSS/JS/images (often from a CDN), renders.</li></ol>
<h3>TCP vs UDP</h3>
<table><tr><th>TCP</th><th>UDP</th></tr><tr><td>Connection, ordered, reliable, congestion control</td><td>No connection, no ordering or retries, lower overhead</td></tr><tr><td>Web, APIs, DBs, file transfer</td><td>Video calls, games, DNS queries, QUIC</td></tr></table>
<h3>HTTP versions</h3>
<ul><li><b>1.1</b>: keep-alive, but one request at a time per connection (browsers open ~6).</li><li><b>2</b>: binary, many streams multiplexed on one TCP connection, header compression. Still suffers TCP head-of-line blocking on packet loss.</li><li><b>3</b>: QUIC over UDP; streams are independent so one lost packet doesn't stall others; faster handshakes.</li></ul>
<h3>Status codes to know</h3><p>200 OK · 201 Created · 204 No Content · 301/302 redirects · 304 Not Modified · 400 Bad Request · 401 Unauthenticated · 403 Forbidden · 404 · 409 Conflict · 429 Too Many Requests · 500 · 502 Bad Gateway · 503 Unavailable · 504 Gateway Timeout.</p>`,
say:["\"The first request pays DNS + TCP + TLS round trips, which is why CDNs terminate TLS close to users.\""],
traps:["401 vs 403: 401 = who are you? 403 = I know you, and no.","HTTP/2 does not remove TCP head-of-line blocking; HTTP/3 does."],
src:[["Hussein Nasser (YouTube)","https://www.youtube.com/@hnasr"]],
quiz:[
{q:"Which protocol does HTTP/3 run on?",o:["TCP","QUIC over UDP","SCTP","WebSocket"],a:1,why:"QUIC is built on UDP and handles reliability per stream."},
{q:"A logged-in user requests an admin page they aren't allowed to see. Best status code?",o:["401","403","404","400"],a:1,why:"They're authenticated, just not authorized: 403."},
{q:"Why would a video call use UDP?",o:["It encrypts by default","Late packets are useless, so retransmission isn't worth the delay","It guarantees ordering","It's required by browsers"],a:1,why:"For real-time media, a dropped frame is better than a delayed one."}]});

T({id:"dns-cdn",w:2,title:"DNS and CDNs",mins:12,
tldr:"<b>DNS</b> turns names into IPs through a cached hierarchy. A <b>CDN</b> caches content at edge servers near users, cutting latency and origin load.",
notes:`<h3>DNS resolution</h3>
<ol><li>Browser/OS cache → recursive resolver (ISP or 8.8.8.8).</li><li>Resolver asks a <b>root</b> server → gets the <b>TLD</b> server (.com).</li><li>TLD → the domain's <b>authoritative</b> name server → returns the A/AAAA record.</li><li>Each answer is cached for its <b>TTL</b>.</li></ol>
<p>Records: A (IPv4), AAAA (IPv6), CNAME (alias), MX (mail), NS, TXT. Low TTL = faster failover, more DNS traffic.</p>
<p>DNS can load-balance (multiple A records, geo-DNS, latency-based routing) but clients cache answers, so failover is slow.</p>
<h3>CDN</h3>
<ul><li><b>Pull CDN</b>: edge fetches from origin on a miss, caches by <code>Cache-Control</code>. Easy; first request is slow.</li><li><b>Push CDN</b>: you upload content ahead of time. Good for big, predictable files.</li><li>Cache static assets, images, video segments, and even API responses that are public and cacheable.</li><li>Invalidate with versioned file names (<code>app.3f9a.js</code>) instead of purging.</li><li>Bonus: TLS termination at the edge, DDoS absorption.</li></ul>`,
real:`Netflix runs its own CDN, Open Connect, placing caching appliances inside ISPs so most video bytes never cross the wider internet.`,
say:["\"Static assets and video segments go through a CDN with long TTLs and versioned names; the origin only serves misses.\""],
traps:["Putting personalised, private responses on a shared CDN cache without <code>Cache-Control: private</code>.","Expecting DNS failover to be instant despite TTL caching."],
src:[["Netflix Open Connect","https://openconnect.netflix.com/"]],
quiz:[
{q:"Order of DNS lookup after the resolver's cache misses?",o:["Authoritative → TLD → root","Root → TLD → authoritative","TLD → root → authoritative","Root → authoritative"],a:1,why:"Root points to the TLD servers, which point to the domain's authoritative servers."},
{q:"Best way to make browsers pick up a new version of app.js served via CDN?",o:["Purge the whole CDN each deploy","Set TTL to 0","Use content-hashed file names like app.3f9a.js","Disable the CDN"],a:2,why:"A new name is a new cache key, so old caches are irrelevant."},
{q:"A pull CDN gets a request for an uncached file. It…",o:["Returns 404","Fetches it from the origin, caches it, returns it","Asks the user to retry","Redirects to the origin permanently"],a:1,why:"That's the definition of pull: populate on miss."}]});

T({id:"proxies-lb",w:2,title:"Proxies, load balancers and API gateways",mins:15,
tldr:"A <b>reverse proxy</b> sits in front of servers. A <b>load balancer</b> is a reverse proxy that spreads traffic. An <b>API gateway</b> adds auth, rate limits and routing for many services.",
notes:`<h3>Forward vs reverse proxy</h3><p><b>Forward</b>: acts for clients (corporate proxy, VPN). <b>Reverse</b>: acts for servers (nginx, Envoy): TLS termination, compression, caching, hiding backends.</p>
<h3>L4 vs L7 load balancing</h3>
<table><tr><th>L4 (transport)</th><th>L7 (application)</th></tr><tr><td>Routes by IP/port, doesn't read HTTP</td><td>Reads URL, headers, cookies</td></tr><tr><td>Very fast, protocol-agnostic</td><td>Path routing (/api → A, /img → B), retries, auth</td></tr><tr><td>AWS NLB</td><td>AWS ALB, nginx, Envoy</td></tr></table>
<h3>Algorithms</h3>
<ul><li><b>Round robin</b> / weighted round robin: simple, assumes equal requests.</li><li><b>Least connections</b>: good when request cost varies (long-lived connections).</li><li><b>IP / consistent hash</b>: same client → same server (cache locality, WebSockets).</li><li><b>Power of two choices</b>: pick 2 random, send to the less loaded.</li></ul>
<p><b>Health checks</b> remove dead servers. Make LBs themselves redundant (active-passive pair or managed LB).</p>
<h3>API gateway</h3><p>Single entry for clients: authentication, rate limiting, request routing to microservices, TLS, request/response transforms, metrics. Variant: <b>BFF</b> (backend for frontend) per client type.</p>`,
diagram:{w:760,h:230,n:[["c",70,115,"Clients","","client"],["gw",240,115,"API gateway","auth · rate limit · route","edge"],["s1",450,45,"User service","","svc"],["s2",450,115,"Order service","","svc"],["s3",450,185,"Search service","","svc"],["d1",650,45,"Users DB","","db"],["d2",650,115,"Orders DB","","db"],["d3",650,185,"Search index","","db"]],e:[["c","gw"],["gw","s1","/users"],["gw","s2","/orders"],["gw","s3","/search"],["s1","d1"],["s2","d2"],["s3","d3"]]},dcap:"An L7 gateway routes by path and handles cross-cutting concerns once.",
say:["\"I'll use an L7 load balancer so I can route /api and /static separately and do health checks.\"","\"WebSocket servers need least-connections or consistent hashing, not plain round robin.\""],
traps:["Calling a CDN a load balancer. Related, not the same.","Forgetting the LB itself must be redundant."],
quiz:[
{q:"You need to route /images to one cluster and /api to another. Which LB?",o:["L4","L7","DNS round robin","None, use a CDN"],a:1,why:"Only L7 understands HTTP paths."},
{q:"Requests vary wildly in cost (some take 10 ms, some 5 s). Best algorithm?",o:["Round robin","Least connections","Random","Static IP hash"],a:1,why:"Least connections avoids piling more work onto a busy server."},
{q:"Which is NOT a typical API gateway job?",o:["Authentication","Rate limiting","Request routing","Running SQL joins for the order service"],a:3,why:"Business/data logic stays in services."}]});

T({id:"api-styles",w:2,title:"API styles: REST, gRPC, GraphQL",mins:12,
tldr:"<b>REST</b> for public resource APIs, <b>gRPC</b> for fast typed service-to-service calls, <b>GraphQL</b> when many clients need flexible shapes of data.",
notes:`<table><tr><th></th><th>REST</th><th>gRPC</th><th>GraphQL</th></tr>
<tr><td>Transport</td><td>HTTP/1.1 or 2, JSON</td><td>HTTP/2, Protobuf (binary)</td><td>HTTP, one endpoint, JSON</td></tr>
<tr><td>Strength</td><td>Simple, cacheable, universal</td><td>Fast, typed contracts, streaming</td><td>Client picks fields; no over/under-fetching</td></tr>
<tr><td>Weakness</td><td>Over-fetching, many round trips</td><td>Browser support needs a proxy, less human-readable</td><td>Caching harder, N+1 queries, query cost limits needed</td></tr>
<tr><td>Use</td><td>Public APIs, CRUD</td><td>Internal microservices</td><td>Mobile + web apps with varied screens</td></tr></table>
<h3>Also know</h3><ul><li><b>WebSockets</b>: bidirectional, persistent. <b>SSE</b>: server → client stream over HTTP. <b>Webhooks</b>: server calls <i>your</i> URL when something happens.</li><li>RPC style ("call a function") vs REST style ("act on a resource").</li></ul>`,
say:["\"Public API in REST for simplicity and caching; internal service calls in gRPC for speed and typed contracts.\""],
traps:["Claiming GraphQL is always faster. It can cause expensive nested queries unless you add limits and DataLoader-style batching."],
quiz:[
{q:"Best fit for high-throughput internal calls between microservices with strict contracts?",o:["REST + JSON","gRPC","GraphQL","SOAP"],a:1,why:"Binary Protobuf over HTTP/2 with generated typed clients."},
{q:"Main thing GraphQL solves?",o:["Encryption","Over- and under-fetching for varied clients","Database sharding","Rate limiting"],a:1,why:"Clients ask for exactly the fields they need in one request."},
{q:"Stripe tells your server when a payment succeeds by calling your URL. That's a…",o:["WebSocket","Webhook","Long poll","gRPC stream"],a:1,why:"Webhook = provider-initiated HTTP callback."}]});

T({id:"api-design",w:2,title:"API design: resources, pagination, idempotency",mins:15,
tldr:"Model <b>resources</b> with nouns and HTTP verbs, paginate with <b>cursors</b>, version deliberately, and make unsafe calls <b>idempotent</b> with keys.",
notes:`<h3>Resource design</h3><pre><code>GET    /v1/users/{id}/orders?cursor=abc&limit=20
POST   /v1/orders                 (create, body = order)
GET    /v1/orders/{id}
PATCH  /v1/orders/{id}            (partial update)
DELETE /v1/orders/{id}</code></pre>
<p>Idempotent verbs: GET, PUT, DELETE (repeating has the same effect). POST and PATCH are not by default.</p>
<h3>Pagination</h3><table><tr><th>Offset (<code>?page=5</code>)</th><th>Cursor (<code>?cursor=&lt;last id&gt;</code>)</th></tr><tr><td>Simple; can jump to page N</td><td>Stable when rows are inserted; fast with an index (<code>WHERE id &lt; :cursor ORDER BY id DESC LIMIT 20</code>)</td></tr><tr><td>Slow for deep pages (DB scans and discards), duplicates/skips when data changes</td><td>Can't jump to an arbitrary page</td></tr></table>
<h3>Idempotency keys</h3><p>Client sends <code>Idempotency-Key: &lt;uuid&gt;</code> on POST. Server stores key → result. A retry with the same key returns the saved result instead of charging twice. Essential for payments and any retried network call.</p>
<h3>Other must-haves</h3><ul><li>Versioning: <code>/v1/</code> in path (simple) or a header.</li><li>Consistent error shape: <code>{"error":{"code":"card_declined","message":"…"}}</code>.</li><li>Auth on every endpoint, rate limits, request IDs for tracing.</li><li>Don't put user IDs from the token in the body; derive them server-side.</li></ul>`,
real:`Stripe's API popularised the Idempotency-Key header: keys are kept for 24 hours and replays return the original response.`,
say:["\"Cursor pagination, because the feed changes constantly and offsets would skip or repeat items.\"","\"POST /payments takes an Idempotency-Key so client retries can't double-charge.\""],
traps:["Verbs in URLs (<code>/createOrder</code>) in a REST design.","Trusting a <code>userId</code> in the request body instead of the auth token."],
src:[["Stripe: idempotency","https://stripe.com/blog/idempotency"]],
quiz:[
{q:"Why prefer cursor over offset pagination for a live feed?",o:["Cursors allow jumping to page 50","New inserts don't cause skipped or duplicate items, and deep pages stay fast","Offsets aren't supported by SQL","Cursors need no index"],a:1,why:"Cursor = 'items after X', stable under inserts and index-friendly."},
{q:"Which HTTP method is NOT idempotent by default?",o:["GET","PUT","DELETE","POST"],a:3,why:"Repeating a POST can create two resources."},
{q:"A mobile app retries POST /payments after a timeout. What stops a double charge?",o:["HTTPS","An Idempotency-Key the server dedupes on","A longer timeout","Using PUT"],a:1,why:"The server recognises the key and returns the original result."}]});

T({id:"realtime",w:2,title:"Real-time: polling, SSE, WebSockets",mins:12,
tldr:"<b>Short polling</b> asks repeatedly, <b>long polling</b> holds the request open until data exists, <b>SSE</b> streams server→client, <b>WebSockets</b> are full duplex.",
notes:`<table><tr><th>Technique</th><th>How</th><th>Good for</th><th>Cost</th></tr>
<tr><td>Short polling</td><td>GET every N seconds</td><td>Rare updates, simplicity</td><td>Wasted requests, delay up to N</td></tr>
<tr><td>Long polling</td><td>Server holds GET until data or timeout, client re-requests</td><td>Fallback when WS blocked</td><td>A request per message</td></tr>
<tr><td>SSE</td><td>One HTTP response that never ends; server pushes events</td><td>Live scores, notifications, LLM token streaming</td><td>One-way only</td></tr>
<tr><td>WebSocket</td><td>HTTP upgrade to a persistent two-way socket</td><td>Chat, multiplayer, collaborative editing</td><td>Stateful connections, harder to scale</td></tr></table>
<h3>Scaling WebSockets</h3><ul><li>Each server holds many open connections; you must know <b>which server holds user X</b>. Keep a map in Redis (user → server) or use pub/sub channels per user/room.</li><li>LB with least-connections; handle reconnects with resume tokens and missed-message sync.</li><li>Heartbeats (ping/pong) detect dead connections.</li></ul>`,
diagram:{w:760,h:240,n:[["a",70,70,"Alice","","client"],["b",70,180,"Bob","","client"],["w1",260,70,"WS server 1","holds Alice","svc"],["w2",260,180,"WS server 2","holds Bob","svc"],["ps",470,125,"Redis pub/sub","user → channel","cache"],["st",660,125,"Message store","","db"]],e:[["a","w1","send",0,1],["b","w2","",0,1],["w1","ps","publish to Bob"],["ps","w2","deliver"],["w1","st","persist",1]]},dcap:"Servers don't talk directly; pub/sub routes a message to whichever server holds the recipient.",
say:["\"Chat needs two-way, low-latency messages, so WebSockets, with a Redis registry of which server holds each user.\"","\"For streaming LLM tokens, SSE is enough because data only flows one way.\""],
traps:["Using plain round robin with no plan for which server owns which connection.","Forgetting offline users: real-time push is an optimisation, the source of truth is the message store."],
quiz:[
{q:"Streaming tokens from an LLM to a browser. Simplest fit?",o:["WebSockets","Server-Sent Events","Short polling","Webhooks"],a:1,why:"One-way server→client stream over plain HTTP."},
{q:"Chat users on different WebSocket servers. How does server 1 deliver to a user on server 2?",o:["Direct DB polling every second","Pub/sub (e.g. Redis) or a user→server registry","Sticky sessions","DNS"],a:1,why:"A routing layer is needed between connection servers."},
{q:"Long polling means…",o:["The client polls every 60 s","The server holds the request open until there's data or a timeout","A persistent bidirectional socket","Server pushes to a client URL"],a:1,why:"Reduces empty responses compared with short polling."}]});

T({id:"auth",w:2,title:"Authentication and authorization",mins:14,
tldr:"<b>AuthN</b> = who you are; <b>AuthZ</b> = what you may do. Sessions are easy to revoke; JWTs are stateless but hard to revoke. <b>OAuth2</b> delegates access; <b>OIDC</b> adds login.",
notes:`<h3>Sessions vs JWT</h3><table><tr><th>Server sessions</th><th>JWT (signed token)</th></tr><tr><td>Random ID in a cookie; data in Redis/DB</td><td>Claims signed by the server; client sends it each request</td></tr><tr><td>Revoke instantly (delete row)</td><td>Valid until expiry; revoke needs a denylist</td></tr><tr><td>Lookup per request</td><td>No lookup; any service can verify the signature</td></tr></table>
<p>Common pattern: <b>short-lived access JWT (5–15 min) + long-lived refresh token</b> stored server-side and rotated.</p>
<h3>OAuth 2.0 and OIDC</h3><ul><li>OAuth2 = <b>authorization</b> framework: "let app X read my Google Drive" without sharing the password. Use the <b>Authorization Code flow with PKCE</b> for web/mobile apps.</li><li>OIDC = identity layer on top: adds an <b>ID token</b> so apps can log users in ("Sign in with Google"). SSO via OIDC or SAML.</li></ul>
<h3>Authorization models</h3><ul><li><b>RBAC</b>: roles (admin, approver) carry permissions.</li><li><b>ABAC</b>: rules on attributes (department = X and amount &lt; 10k).</li><li>Multi-tenant SaaS: every query filtered by <code>tenant_id</code>; Postgres row-level security as a safety net.</li></ul>
<h3>Password storage</h3><p>Never store plain or fast hashes (MD5/SHA-1). Use <b>bcrypt, scrypt or Argon2</b> with a per-user salt.</p>`,
say:["\"Short-lived JWTs so services can verify without a lookup, with refresh tokens in the DB so we can revoke.\"","\"Every query carries tenant_id; RLS in Postgres guards against a missed filter.\""],
traps:["Saying OAuth is an authentication protocol. Login is OIDC on top of OAuth.","Storing sensitive data in a JWT payload: it's signed, not encrypted (base64 is readable)."],
quiz:[
{q:"Main drawback of stateless JWTs?",o:["Can't carry user ID","Hard to revoke before expiry","Need a DB lookup per request","Only work with OAuth"],a:1,why:"No server state means no simple 'log this token out'."},
{q:"'Sign in with Google' is implemented with…",o:["SAML only","OpenID Connect on top of OAuth 2.0","Basic auth","JWT without OAuth"],a:1,why:"OIDC adds the ID token for authentication."},
{q:"How should passwords be stored?",o:["SHA-256 of the password","AES encrypted","bcrypt/Argon2 with a salt","Base64"],a:2,why:"Slow, salted hashing resists brute force."}]});

/* ===== Topics part 2: Data & Storage, Async & Reliability ===== */
T({id:"sql-nosql",w:3,title:"SQL vs NoSQL",mins:14,
tldr:"Default to <b>SQL</b> (Postgres) for relations and transactions. Reach for <b>NoSQL</b> when access is simple key-based lookups at huge scale, or the shape is genuinely flexible.",
notes:`<table><tr><th>Type</th><th>Model</th><th>Examples</th><th>Great for</th></tr>
<tr><td>Relational</td><td>Tables, joins, ACID</td><td>PostgreSQL, MySQL</td><td>Users, orders, payments, anything relational</td></tr>
<tr><td>Key-value</td><td>key → blob</td><td>Redis, DynamoDB</td><td>Sessions, caches, carts, counters</td></tr>
<tr><td>Document</td><td>JSON documents</td><td>MongoDB, Firestore</td><td>Catalogues, profiles with varying fields</td></tr>
<tr><td>Wide-column</td><td>Partition key + clustering columns</td><td>Cassandra, ScyllaDB, HBase</td><td>Massive write-heavy time-ordered data: messages, events, IoT</td></tr>
<tr><td>Graph</td><td>Nodes + edges</td><td>Neo4j</td><td>Friend-of-friend, fraud rings, recommendations</td></tr>
<tr><td>Search</td><td>Inverted index</td><td>Elasticsearch, OpenSearch</td><td>Full-text, fuzzy search, filters</td></tr>
<tr><td>Time-series</td><td>Time-bucketed</td><td>InfluxDB, TimescaleDB</td><td>Metrics, monitoring</td></tr>
<tr><td>Vector</td><td>Embeddings + ANN index</td><td>pgvector, Pinecone, Milvus</td><td>Semantic search, RAG</td></tr></table>
<h3>How to decide out loud</h3><ol><li>Do I need transactions across rows/tables? → SQL.</li><li>Are queries ad-hoc with joins? → SQL.</li><li>Is it one access pattern (get by key / range by partition) at 100k+ writes/s? → wide-column or KV.</li><li>Is the schema truly variable per record? → document (or Postgres JSONB).</li></ol>
<p>"NoSQL scales, SQL doesn't" is outdated: Postgres with read replicas and partitioning handles a lot; NoSQL trades joins and flexible queries for easy horizontal scaling.</p>`,
real:`Discord moved messages from MongoDB to Cassandra and later to ScyllaDB, because chat is write-heavy and read by (channel, time) — a perfect wide-column access pattern.`,
say:["\"Orders and payments need transactions, so Postgres. Chat messages are append-heavy and read by channel + time, so Cassandra keyed by (channel_id, bucket) with message_id clustering.\""],
traps:["Choosing MongoDB \"because it scales\" without naming the access pattern.","Forgetting that Cassandra queries must follow the partition key; you design tables per query."],
src:[["Discord: storing trillions of messages","https://discord.com/blog/how-discord-stores-trillions-of-messages"]],
quiz:[
{q:"A bank ledger with transfers between accounts. Best store?",o:["Cassandra","Redis","PostgreSQL","Elasticsearch"],a:2,why:"Needs multi-row ACID transactions."},
{q:"Billions of chat messages, read as 'latest 50 in channel X'. Good fit?",o:["Neo4j","Wide-column (Cassandra) partitioned by channel","Elasticsearch as primary store","A single MySQL table without partitioning"],a:1,why:"Write-heavy, partition = channel, clustering = time."},
{q:"Find friends-of-friends who like the same pages. Natural model?",o:["Graph DB","Key-value","Time-series","Blob store"],a:0,why:"Multi-hop relationship traversal is what graph DBs do well."}]});

T({id:"acid",w:3,title:"Transactions, ACID and isolation levels",mins:14,
tldr:"<b>ACID</b> = Atomic, Consistent, Isolated, Durable. <b>Isolation levels</b> trade correctness for concurrency; know which anomaly each one prevents.",
notes:`<ul><li><b>Atomicity</b>: all or nothing (transfer debits and credits together).</li><li><b>Consistency</b>: constraints hold before and after (balance ≥ 0, foreign keys).</li><li><b>Isolation</b>: concurrent transactions don't see each other's half-done work.</li><li><b>Durability</b>: once committed, survives a crash (write-ahead log).</li></ul>
<h3>Isolation levels (SQL standard)</h3><table><tr><th>Level</th><th>Dirty read</th><th>Non-repeatable read</th><th>Phantom</th></tr>
<tr><td>Read uncommitted</td><td>possible</td><td>possible</td><td>possible</td></tr>
<tr><td>Read committed (Postgres default)</td><td>no</td><td>possible</td><td>possible</td></tr>
<tr><td>Repeatable read (MySQL InnoDB default)</td><td>no</td><td>no</td><td>possible*</td></tr>
<tr><td>Serializable</td><td>no</td><td>no</td><td>no</td></tr></table>
<p class="small">*Postgres' repeatable read is snapshot isolation and also blocks phantoms, but still allows write skew; only Serializable prevents that.</p>
<h3>Handling concurrent updates</h3><ul><li><b>Pessimistic</b>: <code>SELECT … FOR UPDATE</code> locks the row. Good under high contention (seat booking).</li><li><b>Optimistic</b>: a <code>version</code> column; <code>UPDATE … SET v=v+1 WHERE id=? AND v=?</code>; retry if 0 rows. Good when conflicts are rare.</li><li>Atomic statements: <code>UPDATE stock SET qty = qty - 1 WHERE id=? AND qty &gt; 0</code>.</li></ul>`,
say:["\"Inventory decrement is one conditional UPDATE, so two buyers can't take the last item.\""],
traps:["Read-then-write in app code (read qty, check, write) without a lock or condition: classic race.","Saying Serializable is free. It costs throughput and causes retries."],
quiz:[
{q:"Two users try to book the last seat at the same time. Simplest correct SQL approach?",o:["Read the seat, then update it in app code","UPDATE seats SET user=? WHERE id=? AND user IS NULL and check rows affected","Use Read Uncommitted","Cache the seat in Redis without TTL"],a:1,why:"The condition makes the write atomic; only one update succeeds."},
{q:"Which ACID property is provided by the write-ahead log surviving a crash?",o:["Atomicity only","Consistency","Isolation","Durability"],a:3,why:"Committed data is on disk in the WAL before success is returned."},
{q:"Optimistic locking is best when…",o:["Conflicts are frequent","Conflicts are rare","You need distributed transactions","Reads are rare"],a:1,why:"No lock overhead; occasional retries are cheap."}]});

T({id:"indexing",w:3,title:"Indexes: B-trees and LSM trees",mins:14,
tldr:"An index trades <b>write cost and space</b> for <b>fast reads</b>. B-trees power most SQL indexes; <b>LSM trees</b> power write-heavy stores like Cassandra and RocksDB.",
notes:`<h3>Without vs with an index</h3><p>No index = full table scan, O(n). B-tree index = O(log n) lookup and fast range scans in sorted order.</p>
<h3>Index types</h3><ul><li><b>Composite</b> <code>(user_id, created_at)</code>: follows the <b>leftmost-prefix rule</b>: serves <code>WHERE user_id=?</code> and <code>WHERE user_id=? ORDER BY created_at</code>, but not <code>WHERE created_at=?</code> alone.</li><li><b>Covering</b>: contains every column the query needs → index-only scan.</li><li><b>Partial</b>: <code>WHERE status='pending'</code> only, small and hot.</li><li><b>Hash</b>: equality only. <b>GIN</b>: JSONB / full-text. <b>Geo</b>: GiST/R-tree.</li></ul>
<h3>B-tree vs LSM tree</h3><table><tr><th>B-tree</th><th>LSM tree</th></tr><tr><td>Updates pages in place</td><td>Appends to an in-memory memtable → flushed to sorted SSTables → compacted</td></tr><tr><td>Fast reads, slower random writes</td><td>Very fast writes, reads may check several files (Bloom filters help)</td></tr><tr><td>Postgres, MySQL</td><td>Cassandra, RocksDB, LevelDB, ScyllaDB</td></tr></table>
<h3>Practise</h3><p>Run <code>EXPLAIN ANALYZE</code> before and after adding an index; look for "Seq Scan" turning into "Index Scan".</p>`,
say:["\"I'd add a composite index on (user_id, created_at DESC) so the 'my latest orders' query is an index range scan.\""],
traps:["Indexing every column: each index slows inserts/updates and uses memory.","Composite index column order doesn't matter (it does)."],
quiz:[
{q:"Index on (country, city). Which query can use it efficiently?",o:["WHERE city='Chennai'","WHERE country='IN' AND city='Chennai'","WHERE zip='600001'","ORDER BY city"],a:1,why:"Leftmost-prefix rule: country first."},
{q:"Why are LSM trees good for write-heavy workloads?",o:["They update pages in place","Writes are sequential appends to memory then sorted files","They don't persist data","They have no compaction"],a:1,why:"Sequential writes are fast; compaction happens in the background."},
{q:"Cost of adding more indexes?",o:["Slower reads","Slower writes and more storage","Lost durability","Weaker isolation"],a:1,why:"Every insert/update must also update each index."}]});

T({id:"replication",w:3,title:"Replication",mins:13,
tldr:"Keep copies of data on several nodes for <b>availability</b> and <b>read scale</b>. Leader-follower is the default; async replicas lag, so plan for <b>stale reads</b>.",
notes:`<h3>Topologies</h3><ul><li><b>Single leader</b> (primary/replica): writes to leader, replicated to followers; reads can go to followers. Most SQL setups.</li><li><b>Multi-leader</b>: several leaders (e.g. one per region) accept writes → must resolve conflicts (last-write-wins, CRDTs).</li><li><b>Leaderless</b> (Dynamo style): write to W of N replicas, read from R; quorum W+R&gt;N. Cassandra, DynamoDB.</li></ul>
<h3>Sync vs async</h3><table><tr><th>Synchronous</th><th>Asynchronous</th></tr><tr><td>Leader waits for follower ack → no data loss on failover</td><td>Leader replies immediately → fast, but recent writes may be lost on failover</td></tr><tr><td>Higher write latency; a slow follower blocks writes</td><td>Followers lag (replication lag)</td></tr></table>
<p>Common compromise: <b>semi-synchronous</b> (one sync follower, rest async).</p>
<h3>Replication lag problems and fixes</h3><ul><li><b>Read-your-writes</b>: after a user edits their profile, read their own profile from the leader for a few seconds.</li><li><b>Monotonic reads</b>: pin a user to one replica so time doesn't go backwards.</li><li><b>Failover</b>: detect leader death (heartbeats), promote the most up-to-date follower, fence the old leader to avoid split-brain.</li></ul>`,
diagram:{w:760,h:220,n:[["app",90,110,"App servers","","svc"],["l",320,60,"Primary","writes","db"],["f1",560,40,"Replica A","reads","db"],["f2",560,110,"Replica B","reads","db"],["f3",560,180,"Replica C","other AZ","db"]],e:[["app","l","writes"],["l","f1","WAL stream"],["l","f2"],["l","f3"],["app","f2","reads",1]]},dcap:"Leader-follower: writes go to the primary, reads fan out to replicas that may lag slightly.",
say:["\"Reads go to replicas, but a user's own profile reads hit the primary right after they write, to avoid read-your-write anomalies.\""],
traps:["Replicas don't help write throughput; that needs sharding.","Ignoring split-brain: two nodes both believing they're leader."],
quiz:[
{q:"A user updates their bio and immediately sees the old one. Cause?",o:["Cache stampede","Replication lag on an async replica","Deadlock","Phantom read"],a:1,why:"The read hit a follower that hadn't applied the write yet."},
{q:"Adding read replicas mainly increases…",o:["Write throughput","Read throughput and availability","Storage per row","Strong consistency"],a:1,why:"Writes still all go through the leader."},
{q:"Which replication style needs conflict resolution?",o:["Single-leader sync","Single-leader async","Multi-leader","None"],a:2,why:"Two leaders can accept conflicting writes to the same row."}]});

T({id:"sharding",w:3,title:"Partitioning and sharding",mins:15,
tldr:"<b>Sharding</b> splits data across machines by a <b>shard key</b> so writes and storage scale. Pick the key to spread load evenly and keep common queries on <b>one shard</b>.",
notes:`<h3>Strategies</h3><table><tr><th>Strategy</th><th>How</th><th>Pros</th><th>Cons</th></tr>
<tr><td>Range</td><td>A–F on shard 1, G–M on shard 2… or by date</td><td>Range scans are easy</td><td>Hot spots (everyone writes "today")</td></tr>
<tr><td>Hash</td><td>hash(key) mod N</td><td>Even spread</td><td>Range queries scatter; changing N moves almost everything</td></tr>
<tr><td>Consistent hash</td><td>Keys and nodes on a ring</td><td>Adding a node moves ~1/N of keys</td><td>Needs virtual nodes to balance</td></tr>
<tr><td>Directory</td><td>Lookup table key → shard</td><td>Flexible moves</td><td>Lookup service is a dependency/SPOF</td></tr></table>
<h3>Choosing a shard key</h3><ul><li>High cardinality, evenly used (user_id, tenant_id), not monotonically increasing on a range scheme.</li><li>Matches the main query: chat by <code>channel_id</code>, orders by <code>user_id</code>.</li><li>Hot keys (celebrity, huge tenant): split further (add a suffix: <code>key#0..9</code>) or give them dedicated shards.</li></ul>
<h3>What gets hard</h3><ul><li>Cross-shard joins and transactions (avoid, denormalise, or use sagas).</li><li>Global unique IDs (Snowflake-style IDs instead of auto-increment).</li><li>Resharding: move data while serving traffic (double-write, backfill, cut over).</li></ul>
<p><b>Partitioning</b> often means splitting a table within one DB (Postgres declarative partitioning by month); <b>sharding</b> means across machines.</p>`,
real:`Instagram sharded Postgres into thousands of logical shards mapped onto fewer physical servers, and generated IDs that embed the shard ID so any row's location is known from its ID.`,
say:["\"Shard by user_id so a user's orders live together; analytics that need all users go to a separate warehouse.\""],
traps:["Sharding by timestamp with range partitioning: all writes hit the newest shard.","Proposing sharding at 1,000 QPS. Replicas and caching come first."],
src:[["Instagram: sharding IDs","https://instagram-engineering.com/sharding-ids-at-instagram-1cf5a71e5a5c"]],
quiz:[
{q:"Why is a creation timestamp a poor range-based shard key?",o:["Low cardinality","All new writes land on one shard (hot spot)","Can't be indexed","Timestamps aren't unique"],a:1,why:"Monotonic keys concentrate writes on the latest range."},
{q:"With hash(key) mod N, adding one server causes…",o:["~1/N keys to move","Almost all keys to move","No keys to move","Only hot keys to move"],a:1,why:"The modulus changes for most keys. Consistent hashing fixes this."},
{q:"Main reason to avoid cross-shard transactions?",o:["SQL forbids them","They need slow coordination (2PC) and hurt availability","They use too much disk","They break indexes"],a:1,why:"Coordinating multiple shards is slow and fragile."}]});

T({id:"consistent-hashing",w:3,title:"Consistent hashing",mins:10,
tldr:"Place nodes and keys on a <b>hash ring</b>; each key goes to the next node clockwise. Adding or removing a node moves only about <b>K/N keys</b>. <b>Virtual nodes</b> even out the load.",
notes:`<ol><li>Hash each server (many times, as virtual nodes) to points on a ring 0…2³²−1.</li><li>Hash each key; walk clockwise to the first server point → that server owns it.</li><li>New server: takes over only the keys between it and its predecessor.</li><li>Server dies: its keys shift to the next server; others are untouched.</li></ol>
<h3>Why virtual nodes</h3><p>With few physical nodes, ring gaps are uneven, so one server gets far more keys. Giving each server 100–200 points spreads load and lets bigger machines take more points (weighting).</p>
<h3>Where it's used</h3><p>Distributed caches (client-side memcached sharding), Cassandra and DynamoDB partitioning, load balancers keeping a user on the same backend, CDNs.</p>
<pre><code>import bisect, hashlib
class Ring:
    def __init__(self, nodes, vnodes=100):
        self.ring = sorted((self._h(f"{n}#{i}"), n) for n in nodes for i in range(vnodes))
        self.keys = [h for h, _ in self.ring]
    def _h(self, s): return int(hashlib.md5(s.encode()).hexdigest(), 16)
    def node_for(self, key):
        i = bisect.bisect(self.keys, self._h(key)) % len(self.keys)
        return self.ring[i][1]</code></pre>`,
say:["\"Consistent hashing with virtual nodes, so adding a cache node only remaps about 1/N of keys instead of nearly all of them.\""],
traps:["Forgetting replication on the ring: copies usually go to the next R distinct nodes clockwise."],
src:[["Amazon Dynamo paper","https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf"]],
quiz:[
{q:"Main benefit of consistent hashing over hash mod N?",o:["Faster hashing","Only ~K/N keys move when nodes change","Keys are sorted","No collisions"],a:1,why:"Minimal remapping on membership change."},
{q:"Why use virtual nodes?",o:["Encrypt keys","Spread load evenly and allow weighting","Reduce memory","Avoid replication"],a:1,why:"Many points per server smooth out ring gaps."},
{q:"A key hashes between node A's point and node B's point (clockwise A then B). Who owns it?",o:["A","B","Both","Neither"],a:1,why:"Walk clockwise to the first node: B."}]});

T({id:"caching",w:3,title:"Caching strategies and eviction",mins:15,
tldr:"Cache hot data in memory to cut latency and DB load. Know <b>cache-aside, write-through, write-back, write-around</b>, plus TTLs and <b>LRU</b> eviction.",
notes:`<h3>Where caches live</h3><p>Browser → CDN → API gateway → app in-process (LRU dict) → distributed cache (Redis/Memcached) → DB buffer pool.</p>
<h3>Strategies</h3><table><tr><th>Pattern</th><th>Read</th><th>Write</th><th>Trade-off</th></tr>
<tr><td><b>Cache-aside</b> (lazy)</td><td>App checks cache; on miss reads DB and fills cache</td><td>App writes DB, then deletes the cache key</td><td>Most common; first read is slow; brief staleness possible</td></tr>
<tr><td><b>Read-through</b></td><td>Cache library loads from DB on miss</td><td>—</td><td>Cleaner app code</td></tr>
<tr><td><b>Write-through</b></td><td>Always warm</td><td>Write cache and DB together</td><td>Fresh reads; slower writes; caches unread data</td></tr>
<tr><td><b>Write-back</b> (write-behind)</td><td>—</td><td>Write cache, flush to DB later</td><td>Fast writes; data loss if cache dies</td></tr>
<tr><td><b>Write-around</b></td><td>Fill on read</td><td>Write DB only</td><td>Avoids caching write-once data</td></tr></table>
<h3>Eviction</h3><ul><li><b>LRU</b> (least recently used): default choice.</li><li><b>LFU</b> (least frequently used): keeps long-term popular items.</li><li><b>FIFO</b>, random, and <b>TTL</b> expiry for freshness.</li></ul>
<h3>Why delete instead of update on write?</h3><p>Two concurrent writers can set the cache in the wrong order and leave stale data. Deleting forces the next read to load the current value.</p>
<pre><code>def get_user(uid):
    u = redis.get(f"user:{uid}")
    if u: return json.loads(u)
    u = db.fetch_user(uid)
    redis.set(f"user:{uid}", json.dumps(u), ex=300)   # 5-min TTL as a safety net
    return u</code></pre>`,
diagram:{w:760,h:200,n:[["app",110,100,"App server","","svc"],["c",380,45,"Redis","1. check","cache"],["db",380,160,"Database","2. on miss","db"]],e:[["app","c","get key",0,1],["app","db","read + fill cache",0,1]]},dcap:"Cache-aside: the app talks to both; the cache is only filled on a miss.",
say:["\"Cache-aside with a TTL; on update we write the DB then delete the key.\"","\"At an 80/20 access pattern, caching 20% of the data serves most reads.\""],
traps:["Caching without an invalidation story.","Write-back for money: a cache node crash loses committed payments."],
quiz:[
{q:"In cache-aside, what happens on a cache miss?",o:["Return 404","App reads DB, stores result in cache, returns it","Cache reads DB on its own","Write to DB"],a:1,why:"The app lazily populates the cache."},
{q:"Which strategy risks losing data if the cache crashes?",o:["Cache-aside","Write-through","Write-back","Write-around"],a:2,why:"Writes sit only in the cache until flushed."},
{q:"On an update, why delete the cache key rather than set the new value?",o:["Deletes are faster","Avoids race conditions that leave stale values","Redis can't overwrite","To save memory"],a:1,why:"Concurrent set-after-write can reorder; deletion forces a fresh read."}]});

T({id:"cache-problems",w:3,title:"Cache failure modes",mins:10,
tldr:"Caches fail in specific ways: <b>stampede</b> (many misses at once), <b>hot keys</b>, <b>penetration</b> (misses for keys that don't exist), <b>avalanche</b> (many keys expiring together), and <b>stale data</b>.",
notes:`<table><tr><th>Problem</th><th>What happens</th><th>Fix</th></tr>
<tr><td>Stampede / thundering herd</td><td>Hot key expires; 10k requests hit the DB at once</td><td>Lock or single-flight so one request refills; serve stale while revalidating; early probabilistic refresh</td></tr>
<tr><td>Avalanche</td><td>Many keys share a TTL and expire together, or the cache restarts</td><td>Add random jitter to TTLs; warm the cache; replicas</td></tr>
<tr><td>Penetration</td><td>Requests for non-existent IDs always miss and hit DB</td><td>Cache the "not found" briefly; Bloom filter of valid keys</td></tr>
<tr><td>Hot key</td><td>One key (celebrity post) overloads one Redis shard</td><td>Local in-process cache in front; replicate the key with suffixes (key#1..N)</td></tr>
<tr><td>Stale reads</td><td>DB updated but cache not</td><td>Delete-on-write, short TTLs, CDC-driven invalidation</td></tr></table>`,
real:`Facebook's memcache paper describes "leases" so only one client refills a missing key, which tamed thundering herds on hot keys.`,
say:["\"Add TTL jitter so keys don't expire together, and use a lock so only one request rebuilds a hot key.\""],
traps:["Treating the cache as the source of truth."],
quiz:[
{q:"Thousands of keys all set with TTL = 3600 at deploy time expire together. Fix?",o:["Longer TTL","Random jitter on TTLs","Disable cache","Use LFU"],a:1,why:"Jitter spreads expirations out."},
{q:"Attackers request random non-existent IDs, every one hits the DB. Fix?",o:["Bigger cache","Cache negative results / Bloom filter of valid IDs","Write-back cache","Shorter TTL"],a:1,why:"Stops misses for keys that will never exist."},
{q:"A hot key expires and 10k concurrent requests miss. Best mitigation?",o:["Single-flight lock so one request refills","Add read replicas","Reduce TTL","Use UDP"],a:0,why:"Only one request hits the DB; the rest wait or get the stale value."}]});

T({id:"blob",w:3,title:"Blob storage and large files",mins:12,
tldr:"Store big files in <b>object storage</b> (S3, GCS) and only metadata in the DB. Clients upload and download directly with <b>presigned URLs</b>; large files go in <b>chunks</b>.",
notes:`<h3>Block vs file vs object storage</h3><ul><li><b>Block</b> (EBS): raw disk for a DB or VM.</li><li><b>File</b> (NFS/EFS): shared file system with directories.</li><li><b>Object</b> (S3): key → bytes + metadata, flat namespace, practically unlimited, very durable (S3 is designed for 11 nines durability), cheap, HTTP access.</li></ul>
<h3>Upload flow</h3><ol><li>Client asks API for upload permission → API checks auth, writes a metadata row (status = pending), returns a <b>presigned PUT URL</b>.</li><li>Client uploads directly to S3 (app servers never touch the bytes).</li><li>S3 event / client callback marks the file ready; a worker makes thumbnails or transcodes.</li></ol>
<h3>Large files</h3><ul><li><b>Multipart / chunked upload</b> (e.g. 5–10 MB chunks): resume after failure, upload in parallel.</li><li>Chunk hashes allow <b>deduplication</b> and syncing only changed chunks (Dropbox).</li><li>Serve via CDN with signed URLs for private content.</li></ul>`,

say:["\"File bytes go straight to S3 with a presigned URL; Postgres only stores metadata and ownership.\""],
traps:["Storing images as BLOBs in Postgres at scale.","Streaming uploads through app servers, which wastes bandwidth and memory."],
src:[["Dropbox: Magic Pocket","https://dropbox.tech/infrastructure/inside-the-magic-pocket"]],
quiz:[
{q:"Why use presigned URLs for uploads?",o:["Encrypt files","Clients upload directly to storage, bypassing app servers","Make files public","Compress files"],a:1,why:"Saves app bandwidth and CPU while keeping access controlled and time-limited."},
{q:"Benefit of chunked uploads for a 4 GB file?",o:["Smaller total size","Resume after failure and upload in parallel","No metadata needed","Avoids CDN"],a:1,why:"Only failed chunks are retried."},
{q:"Where should a file's owner, name and size live?",o:["In the S3 object only","In a metadata DB, with the object key pointing to S3","In Redis only","In the CDN"],a:1,why:"Queryable metadata in a DB; bytes in object storage."}]});

T({id:"special-db",w:3,title:"Search, time-series, geo and vector stores",mins:14,
tldr:"Specialised stores beat a general DB for specific queries: <b>inverted index</b> for text, <b>time-series</b> for metrics, <b>geohash/quadtree</b> for nearby search, <b>ANN indexes</b> for embeddings.",
notes:`<h3>Full-text search (Elasticsearch)</h3><p>An <b>inverted index</b> maps each term → list of documents containing it. Supports relevance ranking (BM25), fuzzy match, facets. Usually a <b>secondary index</b>: Postgres is the source of truth, changes flow to Elasticsearch via CDC or a queue.</p>
<h3>Time-series</h3><p>Append-mostly, queried by time range, often downsampled (1s → 1m → 1h) and expired. TimescaleDB, InfluxDB, Prometheus.</p>
<h3>Geospatial: "drivers near me"</h3><ul><li><b>Geohash</b>: encode lat/long into a string; shared prefix ≈ nearby. Query the cell plus its 8 neighbours.</li><li><b>Quadtree</b>: split a square into 4 recursively until each cell has ≤ K points; adapts to density.</li><li><b>H3</b> (Uber): hexagonal grid; neighbours are equidistant.</li><li>Redis GEO and PostGIS give these out of the box.</li></ul>
<h3>Vector search</h3><p>Store embeddings; find nearest neighbours by cosine similarity. Exact search is O(n); <b>ANN</b> indexes like <b>HNSW</b> (graph) or <b>IVF</b> (clusters) trade a little recall for big speed. pgvector keeps vectors next to your relational data.</p>`,
real:`Uber built and open-sourced H3, a hexagonal grid, for pricing and dispatch because hexagons have uniform neighbour distances.`,
say:["\"Postgres stays the source of truth; Elasticsearch is a derived search index fed by CDC, so it can be rebuilt.\""],
traps:["Using SQL LIKE '%term%' for search at scale (no index use).","Making Elasticsearch the primary database for transactional data."],
src:[["Uber H3","https://www.uber.com/blog/h3/"]],
quiz:[
{q:"Core data structure behind full-text search engines?",o:["B-tree","Inverted index","Bloom filter","Skip list"],a:1,why:"Term → posting list of documents."},
{q:"With geohash, how do you avoid missing points just across a cell border?",o:["Use a bigger precision","Also query the 8 neighbouring cells","Use LIKE","Only query exact matches"],a:1,why:"Nearby points can fall in adjacent cells."},
{q:"HNSW is…",o:["A hashing scheme for passwords","A graph-based approximate nearest-neighbour index","A replication protocol","A compression codec"],a:1,why:"Hierarchical Navigable Small World graphs."}]});
